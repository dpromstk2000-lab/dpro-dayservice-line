name: STEP DPRO-SYSTEMS-9 Day Service Operation Demo

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/step-dpro-systems-9-dayservice-operation-demo.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create and clarify day service public operation demo
        shell: python
        run: |
          from pathlib import Path
          import base64
          import re

          official_url = "https://dpro-shop.com/systems/dayservice"
          portal = base64.b64decode("").decode("utf-8")
          banner = base64.b64decode("").decode("utf-8")
          shared_css = base64.b64decode("").decode("utf-8")
          css_marker = "/* DPRO-SYSTEMS-9 DAYSERVICE OPERATION DEMO */"

          screen_files = [
              "index.html",
              "member.html",
              "owner.html",
              "owner-ipad.html",
          ]

          for filename in screen_files:
              if not Path(filename).exists():
                  raise SystemExit(f"ERROR: required public screen not found: {filename}")

          Path("demo-guide.html").write_text(portal, encoding="utf-8")

          def add_body_class(text, filename):
              match = re.search(r"<body([^>]*)>", text, flags=re.I)
              if not match:
                  raise SystemExit(f"ERROR: body tag not found: {filename}")
              attrs = match.group(1)
              if "dayservice-operation-demo-page" in attrs:
                  return text

              class_match = re.search(r'class="([^"]*)"', attrs)
              if class_match:
                  classes = class_match.group(1).strip()
                  new_classes = (classes + " dayservice-operation-demo-page").strip()
                  updated_attrs = (
                      attrs[:class_match.start()] +
                      f'class="{new_classes}"' +
                      attrs[class_match.end():]
                  )
              else:
                  updated_attrs = attrs + ' class="dayservice-operation-demo-page"'

              return text[:match.start()] + "<body" + updated_attrs + ">" + text[match.end():]

          def add_title_label(text, filename):
              match = re.search(r"<title>(.*?)</title>", text, flags=re.I | re.S)
              if not match:
                  raise SystemExit(f"ERROR: title tag not found: {filename}")
              title = match.group(1).strip()
              if "公開操作デモ" in title:
                  return text
              replacement = f"<title>{title}｜公開操作デモ</title>"
              return text[:match.start()] + replacement + text[match.end():]

          def add_demo_meta(text, filename):
              if 'name="robots" content="noindex,nofollow,noarchive"' not in text:
                  head_close = re.search(r"</head>", text, flags=re.I)
                  if not head_close:
                      raise SystemExit(f"ERROR: head closing tag not found: {filename}")
                  meta = (
                      '\n<meta name="robots" content="noindex,nofollow,noarchive">'
                      f'\n<link rel="canonical" href="{official_url}">\n'
                  )
                  text = text[:head_close.start()] + meta + text[head_close.start():]
              elif f'href="{official_url}"' not in text:
                  head_close = re.search(r"</head>", text, flags=re.I)
                  if not head_close:
                      raise SystemExit(f"ERROR: head closing tag not found: {filename}")
                  text = (
                      text[:head_close.start()] +
                      f'\n<link rel="canonical" href="{official_url}">\n' +
                      text[head_close.start():]
                  )
              return text

          def add_css(text, filename):
              if css_marker in text:
                  return text
              close = re.search(r"</style>", text, flags=re.I)
              if not close:
                  raise SystemExit(f"ERROR: style closing tag not found: {filename}")
              return text[:close.start()] + "\n" + shared_css.strip() + "\n" + text[close.start():]

          def add_banner(text, filename):
              element_pattern = re.compile(
                  r'<section\b[^>]*class="[^"]*\bdayservice-operation-demo-banner\b[^"]*"[^>]*>',
                  flags=re.I,
              )
              if element_pattern.search(text):
                  return text

              body = re.search(r"<body[^>]*>", text, flags=re.I)
              if not body:
                  raise SystemExit(f"ERROR: body tag not found for banner: {filename}")
              return text[:body.end()] + "\n" + banner + "\n" + text[body.end():]

          def replace_visible_versions(text):
              badge_pattern = re.compile(
                  r'(<div\b[^>]*class="[^"]*\bversion-badge\b[^"]*"[^>]*>).*?(</div>)',
                  flags=re.I | re.S,
              )
              text = badge_pattern.sub(
                  r'\1PUBLIC OPERATION DEMO\2',
                  text,
              )

              footer_pattern = re.compile(
                  r'(<footer\b[^>]*class="[^"]*\bfooter\b[^"]*"[^>]*>)(.*?)(</footer>)',
                  flags=re.I | re.S,
              )

              def update_footer(match):
                  inner = re.sub(
                      r'STEP DAYCARE-[A-Z0-9._-]+',
                      'PUBLIC OPERATION DEMO',
                      match.group(2),
                      count=1,
                  )
                  return match.group(1) + inner + match.group(3)

              return footer_pattern.sub(update_footer, text)

          def remove_public_system_check_links(text):
              pattern = re.compile(
                  r'<a\b[^>]*href=["\'][^"\']*system-check\.html[^"\']*["\'][^>]*>.*?</a>',
                  flags=re.I | re.S,
              )
              return pattern.sub("", text)

          for filename in screen_files:
              text = Path(filename).read_text(encoding="utf-8")
              text = add_title_label(text, filename)
              text = add_demo_meta(text, filename)
              text = add_body_class(text, filename)
              text = add_css(text, filename)
              text = add_banner(text, filename)
              text = replace_visible_versions(text)
              text = remove_public_system_check_links(text)
              Path(filename).write_text(text, encoding="utf-8")

          guide = Path("demo-guide.html").read_text(encoding="utf-8")
          assert "公開操作デモ・画面一覧" in guide
          assert "施設側デモ管理コード：1234" in guide
          assert "090-9999-1111" in guide
          assert "DAY-DEMO-001" in guide
          assert guide.count('class="card"') == 4
          assert "system-check" not in guide
          for target in screen_files:
              assert f'href="{target}' in guide

          banner_element_pattern = re.compile(
              r'<section\b[^>]*class="[^"]*\bdayservice-operation-demo-banner\b[^"]*"[^>]*>',
              flags=re.I,
          )
          public_check_link_pattern = re.compile(
              r'<a\b[^>]*href=["\'][^"\']*system-check\.html[^"\']*["\'][^>]*>',
              flags=re.I,
          )
          visible_step_pattern = re.compile(
              r'<(?:div|footer)\b[^>]*(?:version-badge|footer)[^>]*>.*?STEP DAYCARE-.*?</(?:div|footer)>',
              flags=re.I | re.S,
          )

          for filename in screen_files:
              content = Path(filename).read_text(encoding="utf-8")
              title_match = re.search(r"<title>(.*?)</title>", content, flags=re.I | re.S)
              assert title_match and "公開操作デモ" in title_match.group(1), filename
              assert 'name="robots" content="noindex,nofollow,noarchive"' in content, filename
              assert f'<link rel="canonical" href="{official_url}">' in content, filename
              assert "dayservice-operation-demo-page" in content, filename
              assert banner_element_pattern.search(content), filename
              assert css_marker in content, filename
              assert "demo-guide.html" in content, filename
              assert official_url in content, filename
              assert not public_check_link_pattern.search(content), filename
              assert not visible_step_pattern.search(content), filename

          family = Path("index.html").read_text(encoding="utf-8")
          member = Path("member.html").read_text(encoding="utf-8")
          owner = Path("owner.html").read_text(encoding="utf-8")
          ipad = Path("owner-ipad.html").read_text(encoding="utf-8")

          assert "デモ情報を入力" in family
          assert "090-9999-1111" in family
          assert "DAY-DEMO-001" in family
          assert "デモ情報を入力" in member
          assert "デモ管理コード 1234" in owner
          assert "デモ管理コード 1234" in ipad

          # 内部検査画面と内部バージョン定数は変更対象外
          assert Path("system-check.html").exists()
          assert "SCREEN_VERSION" in member
          assert "SCREEN_VERSION" in ipad

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "dpro-systems-bot"
          git config user.email "actions@users.noreply.github.com"
          git add demo-guide.html index.html member.html owner.html owner-ipad.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "STEP DPRO-SYSTEMS-9 clarify day service operation demo"
          git push
