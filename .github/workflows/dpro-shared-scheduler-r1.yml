name: DPRO Shared Scheduler R1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DAYCARE_WORKER: dpro-dayservice-line-api
      SHOP_WORKER: dpro-shop-site-monitor-api

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Find Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN is missing'; exit 2; }

          curl -fsS -H "Authorization: Bearer $CF_TOKEN"             https://api.cloudflare.com/client/v4/accounts > /tmp/accounts.json

          python3 - <<'PY' > /tmp/account-ids
          import json
          d=json.load(open('/tmp/accounts.json'))
          for row in d.get('result') or []:
              if isinstance(row,dict) and row.get('id'):
                  print(row['id'])
          PY

          found=''
          while IFS= read -r aid; do
            [ -n "$aid" ] || continue
            code1=$(curl -sS -o /tmp/daycare-probe -w '%{http_code}'               -H "Authorization: Bearer $CF_TOKEN"               "https://api.cloudflare.com/client/v4/accounts/$aid/workers/scripts/$DAYCARE_WORKER/content/v2")
            code2=$(curl -sS -o /tmp/shop-probe -w '%{http_code}'               -H "Authorization: Bearer $CF_TOKEN"               "https://api.cloudflare.com/client/v4/accounts/$aid/workers/scripts/$SHOP_WORKER/content/v2")
            if [ "$code1" = "200" ] && [ "$code2" = "200" ]; then
              found="$aid"
              break
            fi
          done < /tmp/account-ids

          [ -n "$found" ] || { echo 'Target Workers account not found'; exit 3; }
          echo "::add-mask::$found"
          printf '%s' "$found" > /tmp/dpro-account-id

      - name: Backup current Workers
        shell: bash
        run: |
          set -euo pipefail
          aid=$(cat /tmp/dpro-account-id)
          mkdir -p /tmp/dpro-backup

          cp worker.js /tmp/dpro-backup/daycare-worker-repo-before-r16.js

          curl -fsS -D /tmp/shop-headers-before.txt             -H "Authorization: Bearer $CF_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$aid/workers/scripts/$SHOP_WORKER/content/v2"             -o /tmp/dpro-backup/shop-content-before.bin

          curl -fsS             -H "Authorization: Bearer $CF_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$aid/workers/scripts/$SHOP_WORKER/settings"             > /tmp/dpro-backup/shop-settings-before.json

          curl -fsS             -H "Authorization: Bearer $CF_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$aid/workers/scripts/$SHOP_WORKER/schedules"             > /tmp/dpro-backup/shop-schedules-before.json

      - name: Materialize SHOP modules
        shell: bash
        run: |
          set -euo pipefail
          aid=$(cat /tmp/dpro-account-id)

          curl -fsS -D /tmp/shop-headers.txt             -H "Authorization: Bearer $CF_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$aid/workers/scripts/$SHOP_WORKER/content/v2"             -o /tmp/shop-content.bin

          curl -fsS             -H "Authorization: Bearer $CF_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$aid/workers/scripts/$SHOP_WORKER/settings"             > /tmp/shop-settings.json

          rm -rf /tmp/shop-modules
          mkdir -p /tmp/shop-modules

          python3 - <<'PY'
          import json,re
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default

          settings=json.load(open('/tmp/shop-settings.json'))
          result=settings.get('result') or {}
          main=result.get('main_module')
          if not main:
              raise SystemExit('SHOP main_module missing')

          headers=Path('/tmp/shop-headers.txt').read_text(errors='ignore')
          body=Path('/tmp/shop-content.bin').read_bytes()
          m=re.search(r'content-type:\s*([^\r\n]+)',headers,re.I)
          ctype=m.group(1).strip() if m else ''
          if 'multipart/' not in ctype.lower():
              raise SystemExit('Expected multipart SHOP worker content')

          raw=(f'Content-Type: {ctype}\r\nMIME-Version: 1.0\r\n\r\n').encode()+body
          msg=BytesParser(policy=default).parsebytes(raw)

          manifest=[]
          for part in msg.iter_parts():
              payload=part.get_payload(decode=True) or b''
              name=(part.get_filename() or part.get_param('name',header='content-disposition'))
              if not name or name=='metadata':
                  continue
              safe=Path(name).name
              path=Path('/tmp/shop-modules')/safe
              path.write_bytes(payload)
              manifest.append({
                  'name':safe,
                  'content_type':part.get_content_type(),
              })

          if not manifest:
              raise SystemExit('No SHOP modules found')
          if Path(main).name not in [x['name'] for x in manifest]:
              raise SystemExit('SHOP main module not found in content')

          Path('/tmp/shop-main-module').write_text(Path(main).name)
          Path('/tmp/shop-module-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False))
          print('SHOP_MAIN_MODULE='+Path(main).name)
          print('SHOP_MODULE_COUNT='+str(len(manifest)))
          PY

      - name: Patch DAYCARE and SHOP
        shell: bash
        env:
          DAYCARE_PATCH_B64: ""
          SHOP_PATCH_B64: ""
        run: |
          set -euo pipefail

          python -c 'import os,base64; exec(base64.b64decode(os.environ["DAYCARE_PATCH_B64"]).decode("utf-8"))'

          export SHOP_MAIN_MODULE="/tmp/shop-modules/$(cat /tmp/shop-main-module)"
          python -c 'import os,base64; exec(base64.b64decode(os.environ["SHOP_PATCH_B64"]).decode("utf-8"))'

          node --check worker.js
          node --check "$SHOP_MAIN_MODULE"

          grep -q 'DAYCARE-3-R16-SHARED-SCHEDULER-20260930' worker.js
          grep -q '/api/internal/scheduler/auto-escalation' worker.js
          grep -q 'utcMinute % 6 === 0' "$SHOP_MAIN_MODULE"
          grep -q 'DPRO shared scheduler DAYCARE' "$SHOP_MAIN_MODULE"

          echo "STATIC_QA=PASS"

      - name: Update DAYCARE repository source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/contents/worker.js?ref=main"             > /tmp/current-worker.json

          python3 - <<'PY' > /tmp/payload-worker.json
          import json,base64
          from pathlib import Path
          current=json.load(open('/tmp/current-worker.json'))
          print(json.dumps({
            "message":"DAYCARE R16 shared scheduler bridge",
            "content":base64.b64encode(Path("worker.js").read_bytes()).decode("ascii"),
            "sha":current["sha"],
            "branch":"main"
          }))
          PY

          curl -fsSL -X PUT             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "Content-Type: application/json"             "https://api.github.com/repos/$REPO/contents/worker.js"             --data-binary @/tmp/payload-worker.json > /tmp/update-worker.json

          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/update-worker.json'))
          if not (d.get('commit') or {}).get('sha'):
              raise SystemExit('DAYCARE repository update failed')
          print('DAYCARE_REPO_UPDATE=PASS')
          PY

      - name: Deploy DAYCARE R16
        shell: bash
        run: |
          set -euo pipefail
          aid=$(cat /tmp/dpro-account-id)

          code=$(curl -sS -o /tmp/daycare-deploy.json -w '%{http_code}'             -X PUT             -H "Authorization: Bearer $CF_TOKEN"             -F 'metadata={"main_module":"worker.js","keep_bindings":["plain_text","secret_text"]};type=application/json'             -F 'worker.js=@worker.js;type=application/javascript+module'             "https://api.cloudflare.com/client/v4/accounts/$aid/workers/scripts/$DAYCARE_WORKER/content")

          echo "DAYCARE_DEPLOY_HTTP=$code"
          [ "$code" = "200" ] || { cat /tmp/daycare-deploy.json; exit 4; }

      - name: Deploy patched SHOP monitor
        shell: bash
        run: |
          set -euo pipefail
          aid=$(cat /tmp/dpro-account-id)

          python3 - <<'PY' > /tmp/shop-upload-metadata.json
          import json
          main=open('/tmp/shop-main-module').read().strip()
          print(json.dumps({
              "main_module":main,
              "keep_bindings":["plain_text","secret_text"]
          }))
          PY

          args=(
            -sS -o /tmp/shop-deploy.json -w '%{http_code}'
            -X PUT
            -H "Authorization: Bearer $CF_TOKEN"
            -F "metadata=</tmp/shop-upload-metadata.json;type=application/json"
          )

          while IFS=$'\t' read -r part ctype; do
            args+=(-F "$part=@/tmp/shop-modules/$part;type=$ctype")
          done < <(python3 - <<'PY'
          import json
          for x in json.load(open('/tmp/shop-module-manifest.json')):
              print(x['name']+"\t"+(x.get('content_type') or 'application/javascript+module'))
          PY
          )

          code=$(curl "${args[@]}"             "https://api.cloudflare.com/client/v4/accounts/$aid/workers/scripts/$SHOP_WORKER/content")

          echo
          echo "SHOP_DEPLOY_HTTP=$code"
          [ "$code" = "200" ] || { cat /tmp/shop-deploy.json; exit 5; }

      - name: Install shared scheduler secret
        shell: bash
        run: |
          set -euo pipefail
          aid=$(cat /tmp/dpro-account-id)

          secret=$(python3 - <<'PY'
          import secrets
          print(secrets.token_urlsafe(48))
          PY
          )
          echo "::add-mask::$secret"
          printf '%s' "$secret" > /tmp/dpro-scheduler-secret

          for worker in "$DAYCARE_WORKER" "$SHOP_WORKER"; do
            WORKER="$worker" SECRET="$secret" python3 - <<'PY' > /tmp/secret-payload.json
          import os,json
          print(json.dumps({
            "name":"DPRO_SCHEDULER_SECRET",
            "text":os.environ["SECRET"],
            "type":"secret_text"
          }))
          PY

            code=$(curl -sS -o /tmp/secret-result.json -w '%{http_code}'               -X PUT               -H "Authorization: Bearer $CF_TOKEN"               -H "Content-Type: application/json"               --data-binary @/tmp/secret-payload.json               "https://api.cloudflare.com/client/v4/accounts/$aid/workers/scripts/$worker/secrets")
            echo "$worker SECRET_HTTP=$code"
            [ "$code" = "200" ] || { cat /tmp/secret-result.json; exit 6; }
          done

      - name: Reuse existing SHOP cron as shared scheduler
        shell: bash
        run: |
          set -euo pipefail
          aid=$(cat /tmp/dpro-account-id)

          printf '%s' '[{"cron":"* * * * *"}]' > /tmp/schedules-payload.json

          code=$(curl -sS -o /tmp/schedules-update.json -w '%{http_code}'             -X PUT             -H "Authorization: Bearer $CF_TOKEN"             -H "Content-Type: application/json"             --data-binary @/tmp/schedules-payload.json             "https://api.cloudflare.com/client/v4/accounts/$aid/workers/scripts/$SHOP_WORKER/schedules")

          echo "SCHEDULE_UPDATE_HTTP=$code"
          [ "$code" = "200" ] || { cat /tmp/schedules-update.json; exit 7; }

          curl -fsS             -H "Authorization: Bearer $CF_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$aid/workers/scripts/$SHOP_WORKER/schedules"             > /tmp/schedules-after.json

          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/schedules-after.json'))
          result=d.get('result')
          if isinstance(result,dict):
              rows=result.get('schedules') or []
          elif isinstance(result,list):
              rows=result
          else:
              rows=[]
          crons=[]
          for row in rows:
              if isinstance(row,dict): c=row.get('cron')
              elif isinstance(row,str): c=row
              else: c=None
              if c: crons.append(c)
          print("SHOP_CRONS=",crons)
          if "* * * * *" not in crons:
              raise SystemExit("Shared scheduler cron not confirmed")
          print("SHARED_CRON_QA=PASS")
          PY

      - name: Verify R16 health
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time,urllib.request
          url='https://dpro-dayservice-line-api.dpromstk2000.workers.dev/api/health'
          expected='DAYCARE-3-R16-SHARED-SCHEDULER-20260930'
          last={}
          for _ in range(20):
              req=urllib.request.Request(url,headers={
                'Accept':'application/json',
                'User-Agent':'DPRO-SHARED-SCHEDULER-R1'
              })
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      last=json.loads(r.read().decode())
                  f=last.get('features') or {}
                  if last.get('workerVersion')==expected and f.get('shared_scheduler_bridge') is True:
                      print("R16_HEALTH_QA=PASS")
                      break
              except Exception as e:
                  print("retry",repr(e))
              time.sleep(2)
          else:
              raise SystemExit("R16 did not become live")
          PY

      - name: Invoke shared scheduler safely
        shell: bash
        run: |
          set -euo pipefail
          secret=$(cat /tmp/dpro-scheduler-secret)

          code=$(curl -sS -o /tmp/scheduler-call.json -w '%{http_code}'             -X POST             -H 'Content-Type: application/json'             -H "X-DPRO-Scheduler-Secret: $secret"             --data '{}'             'https://dpro-dayservice-line-api.dpromstk2000.workers.dev/api/internal/scheduler/auto-escalation')

          echo "SCHEDULER_CALL_HTTP=$code"
          cat /tmp/scheduler-call.json
          [ "$code" = "200" ] || exit 8

      - name: Verify DAYCARE escalation history
        shell: bash
        run: |
          set -euo pipefail
          sleep 2

          curl -fsS             -H 'Accept: application/json'             -H 'X-Admin-Code: 1234'             'https://dpro-dayservice-line-api.dpromstk2000.workers.dev/api/admin/broadcasts/history?facility_code=dpro_dayservice_demo'             > /tmp/history-after.json

          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/history-after.json'))
          rows=d.get('broadcasts') or []
          matches=[r for r in rows if r.get('subject')=='【デモ】自動段階配信テスト']
          print("TEST_HISTORY_COUNT=",len(matches))
          for r in matches[:5]:
              print(
                  "TEST_HISTORY=",
                  r.get('broadcast_type'),
                  (r.get('routing_summary') or {}).get('stage_label'),
                  r.get('created_at')
              )

          if not any(r.get('broadcast_type')=='demo_escalation' for r in matches):
              raise SystemExit("Auto escalation history not confirmed")

          print("AUTO_ESCALATION_QA=PASS")
          PY

      - name: Build backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dpro-shared-scheduler-r1-backup
          path: /tmp/dpro-backup/
          if-no-files-found: warn
