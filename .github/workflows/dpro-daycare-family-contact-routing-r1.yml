name: DPRO DAYCARE Family Contact Routing R1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply worker routing patch
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          python -c 'import os,base64; exec(base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8"))'

      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'DAYCARE-3-R8-FAMILY-CONTACT-ROUTING-20260930' worker.js
          grep -q 'function relationAllowsBroadcast' worker.js
          grep -q 'receive_normal' worker.js
          grep -q 'receive_emergency' worker.js
          grep -q 'allow_escalation' worker.js
          grep -q 'routing_mode: targets.routing_mode' worker.js
          echo "STATIC_QA=PASS"

      - name: Update worker.js through GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/contents/worker.js?ref=main"             > /tmp/current.json

          python - <<'PY'
          import json, base64
          from pathlib import Path

          current=json.load(open("/tmp/current.json", encoding="utf-8"))
          payload={
              "message":"DAYCARE family contact routing R1",
              "content":base64.b64encode(Path("worker.js").read_bytes()).decode("ascii"),
              "sha":current["sha"],
              "branch":"main",
          }
          Path("/tmp/payload.json").write_text(
              json.dumps(payload, ensure_ascii=False),
              encoding="utf-8",
          )
          PY

          curl -fsSL             -X PUT             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "Content-Type: application/json"             "https://api.github.com/repos/$REPO/contents/worker.js"             --data-binary @/tmp/payload.json             > /tmp/update.json

          python - <<'PY'
          import json
          d=json.load(open("/tmp/update.json", encoding="utf-8"))
          if not (d.get("commit") or {}).get("sha"):
              raise SystemExit("ERROR: worker.js update failed")
          print("GITHUB_UPDATE=PASS")
          print("commit_sha="+d["commit"]["sha"])
          PY

      - name: Summary
        shell: bash
        run: |
          echo "## DPRO DAYCARE Family Contact Routing R1" >> "$GITHUB_STEP_SUMMARY"
          echo "- Normal broadcasts: only enabled family relations" >> "$GITHUB_STEP_SUMMARY"
          echo "- Emergency broadcasts: only enabled emergency family relations" >> "$GITHUB_STEP_SUMMARY"
          echo "- Explicit family selection remains available" >> "$GITHUB_STEP_SUMMARY"
          echo "- Contact priority preserved for staged escalation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Automatic second-family escalation is not enabled yet" >> "$GITHUB_STEP_SUMMARY"
