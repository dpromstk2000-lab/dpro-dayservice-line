name: DPRO Shared Scheduler Secret Diagnose R4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DAYCARE_WORKER: dpro-dayservice-line-api
      SHOP_WORKER: dpro-shop-site-monitor-api

    steps:
      - name: Diagnose Worker secret API
        shell: bash
        run: |
          set -euo pipefail

          echo "## DPRO Shared Scheduler Secret Diagnose R4" >> "$GITHUB_STEP_SUMMARY"

          curl -fsS -H "Authorization: Bearer $CF_TOKEN" \
            https://api.cloudflare.com/client/v4/accounts > /tmp/accounts.json

          python3 - <<'PY' > /tmp/account-ids
          import json
          d=json.load(open('/tmp/accounts.json'))
          for row in d.get('result') or []:
              if isinstance(row,dict) and row.get('id'):
                  print(row['id'])
          PY

          found=''
          while IFS= read -r aid; do
            [ -n "$aid" ] || continue
            a=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$aid/workers/scripts/$DAYCARE_WORKER/content/v2")
            b=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$aid/workers/scripts/$SHOP_WORKER/content/v2")
            if [ "$a" = "200" ] && [ "$b" = "200" ]; then
              found="$aid"
              break
            fi
          done < /tmp/account-ids

          if [ -z "$found" ]; then
            echo "- DIAG_RESULT=ACCOUNT_NOT_FOUND" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::add-mask::$found"
          secret=$(python3 - <<'PY'
          import secrets
          print(secrets.token_urlsafe(24))
          PY
          )
          echo "::add-mask::$secret"

          echo '```text' >> "$GITHUB_STEP_SUMMARY"

          for worker in "$DAYCARE_WORKER" "$SHOP_WORKER"; do
            echo "WORKER=$worker" | tee -a "$GITHUB_STEP_SUMMARY"

            list_code=$(curl -sS -o /tmp/list.json -w '%{http_code}' \
              -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$found/workers/scripts/$worker/secrets")
            echo "LIST_HTTP=$list_code" | tee -a "$GITHUB_STEP_SUMMARY"
            put_code=$(TEST_SECRET="$secret" curl -sS -o /tmp/put.json -w '%{http_code}' \
              -X PUT \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary "{\"name\":\"DPRO_SCHEDULER_SECRET_TEST\",\"text\":\"$secret\",\"type\":\"secret_text\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$found/workers/scripts/$worker/secrets")

            echo "PUT_HTTP=$put_code" | tee -a "$GITHUB_STEP_SUMMARY"

            python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          try:
              d=json.load(open('/tmp/put.json'))
          except Exception:
              d={}
          errs=d.get('errors') or []
          for e in errs:
              print("ERROR_CODE="+str(e.get('code')))
              print("ERROR_MESSAGE="+str(e.get('message')))
          if d.get('success') is True:
              print("PUT_SUCCESS=true")
          PY

            if [ "$put_code" = "200" ]; then
              del_code=$(curl -sS -o /tmp/del.json -w '%{http_code}' \
                -X DELETE \
                -H "Authorization: Bearer $CF_TOKEN" \
                "https://api.cloudflare.com/client/v4/accounts/$found/workers/scripts/$worker/secrets/DPRO_SCHEDULER_SECRET_TEST")
              echo "DELETE_HTTP=$del_code" | tee -a "$GITHUB_STEP_SUMMARY"
            fi

            echo "---" | tee -a "$GITHUB_STEP_SUMMARY"
          done

          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "- This workflow only used a temporary test secret and deleted it after a successful write." >> "$GITHUB_STEP_SUMMARY"
