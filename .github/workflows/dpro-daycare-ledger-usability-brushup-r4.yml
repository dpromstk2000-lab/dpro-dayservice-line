name: DPRO DAYCARE Ledger Usability Brushup R4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brushup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Brush up owner ledger UX
        shell: bash
        env:
          RENDER_B64: 
          CSS_B64: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, base64

          p = Path("owner.html")
          s = p.read_text(encoding="utf-8")

          # Naming / descriptions
          s = s.replace("利用者・家族検索", "利用者・家族台帳")
          s = s.replace(
              "氏名・電話番号・利用者番号から検索します。",
              "利用者・ご家族の登録情報、連絡先、利用状況を確認します。"
          )
          s = s.replace(
              "利用者名、家族名、電話番号、利用者番号から検索できます。",
              "利用者・ご家族の登録情報をまとめて確認できます。氏名・電話番号・利用者番号で絞り込めます。"
          )
          s = s.replace(
              "<h3>検索結果</h3>\n                  <p>利用者と家族をまとめて表示します。</p>",
              "<h3>台帳一覧</h3>\n                  <p>検索すると、利用者とご家族をまとめて表示します。</p>"
          )
          s = s.replace(
              "左の検索結果から利用者を選択してください。",
              "左の台帳一覧から利用者を選択すると、登録情報・ご家族・利用予定・連絡履歴を確認できます。"
          )

          # Orientation panel
          anchor = '''          <div class="toolbar">
            <input
              class="input search-input"
              id="searchInput"
          '''
          insert = '''          <div class="ledger-guide" aria-label="利用者・家族台帳の使い方">
            <div class="ledger-guide-icon" aria-hidden="true">👤</div>
            <div>
              <strong>利用者・ご家族の情報をここでまとめて確認できます</strong>
              <p>利用者を選ぶと、ご家族の続柄・電話番号・LINE連携状況、利用予定、家族からの連絡履歴まで確認できます。</p>
            </div>
          </div>

          <div class="toolbar">
            <input
              class="input search-input"
              id="searchInput"
          '''
          if 'class="ledger-guide"' not in s:
              if anchor not in s:
                  raise SystemExit("ERROR: ledger toolbar anchor not found")
              s = s.replace(anchor, insert, 1)

          # Replace renderUserDetail as one decoded payload.
          start = s.find("      function renderUserDetail(data) {")
          end = s.find("      function selectUserForSchedule(", start)
          if start < 0 or end < 0:
              raise SystemExit("ERROR: renderUserDetail block not found")
          new_render = base64.b64decode(os.environ["RENDER_B64"]).decode("utf-8")
          s = s[:start] + new_render + s[end:]

          # Initial empty guidance
          init_anchor = '''        attachEvents();

        if (demoPreview || CONFIG.storage.getAdminCode()) {
          '''
          init_insert = '''        attachEvents();

        if (els.searchResults && !els.searchResults.innerHTML.trim()) {
          els.searchResults.innerHTML = `
            <div class="ledger-empty-guide">
              <strong>利用者・ご家族を検索してください</strong>
              <span>氏名、電話番号、利用者番号の一部でも検索できます。</span>
            </div>
          `;
        }

        if (demoPreview || CONFIG.storage.getAdminCode()) {
          '''
          if 'class="ledger-empty-guide"' not in s:
              if init_anchor not in s:
                  raise SystemExit("ERROR: initialize anchor not found")
              s = s.replace(init_anchor, init_insert, 1)

          # CSS
          marker = "DPRO DAYCARE LEDGER USABILITY BRUSHUP R4"
          if marker not in s:
              css = base64.b64decode(os.environ["CSS_B64"]).decode("utf-8")
              close = "</style>\n</head>"
              if close not in s:
                  raise SystemExit("ERROR: style close anchor not found")
              s = s.replace(close, css + "\n</style>\n</head>", 1)

          required = [
              "利用者・家族台帳",
              "ledger-guide",
              "ご家族・LINE連携",
              "DPRO DAYCARE LEDGER USABILITY BRUSHUP R4",
              "LINE連携状況は、緊急・一斉連絡の送信対象判定にも使用します。",
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit("ERROR: required content missing: " + ", ".join(missing))

          p.write_text(s, encoding="utf-8")
          print("OWNER_PATCH=PASS")
          PY

      - name: Validate owner source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'DPRO DAYCARE READABILITY BRUSHUP R2' owner.html
          grep -q 'DPRO DAYCARE LEDGER USABILITY BRUSHUP R4' owner.html
          grep -q '利用者・家族台帳' owner.html
          grep -q 'ご家族・LINE連携' owner.html
          echo "STATIC_QA=PASS"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- owner.html; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add owner.html
          git commit -m "DAYCARE ledger usability brushup R4"
          git push origin HEAD:main

      - name: Summary
        shell: bash
        run: |
          {
            echo "## DPRO DAYCARE Ledger Usability Brushup R4"
            echo ""
            echo "- Public demo banner clipping: fixed"
            echo "- 利用者・家族台帳: upgraded"
            echo "- Family / contact / LINE status presentation: added"
            echo "- Schedule / family-contact history scanability: improved"
            echo "- Existing APIs and broadcast behavior: unchanged"
            echo "- Static QA: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
