name: DPRO Shared Scheduler Diagnose R2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DAYCARE_WORKER: dpro-dayservice-line-api
      SHOP_WORKER: dpro-shop-site-monitor-api

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Find Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CF_TOKEN" \
            https://api.cloudflare.com/client/v4/accounts > /tmp/accounts.json
          python3 - <<'PY' > /tmp/account-ids
          import json
          d=json.load(open('/tmp/accounts.json'))
          for row in d.get('result') or []:
              if isinstance(row,dict) and row.get('id'):
                  print(row['id'])
          PY
          found=''
          while IFS= read -r aid; do
            [ -n "$aid" ] || continue
            a=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$aid/workers/scripts/$DAYCARE_WORKER/content/v2")
            b=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$aid/workers/scripts/$SHOP_WORKER/content/v2")
            if [ "$a" = "200" ] && [ "$b" = "200" ]; then
              found="$aid"; break
            fi
          done < /tmp/account-ids
          [ -n "$found" ] || { echo 'DIAG_FAIL=ACCOUNT_NOT_FOUND'; exit 3; }
          echo "::add-mask::$found"
          printf '%s' "$found" > /tmp/account-id
          echo "DIAG_ACCOUNT=PASS"

      - name: Inspect SHOP settings/content shape
        shell: bash
        run: |
          set -euo pipefail
          aid=$(cat /tmp/account-id)

          curl -fsS \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$aid/workers/scripts/$SHOP_WORKER/settings" \
            > /tmp/shop-settings.json

          curl -fsS -D /tmp/shop-headers.txt \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$aid/workers/scripts/$SHOP_WORKER/content/v2" \
            -o /tmp/shop-content.bin

          python3 - <<'PY'
          import json,re
          from pathlib import Path
          d=json.load(open('/tmp/shop-settings.json'))
          r=d.get('result') or {}
          print("SHOP_MAIN_MODULE=",r.get('main_module'))
          print("SHOP_BINDING_COUNT=",len(r.get('bindings') or []))

          h=Path('/tmp/shop-headers.txt').read_text(errors='ignore')
          m=re.search(r'content-type:\s*([^\r\n]+)',h,re.I)
          ctype=m.group(1).strip() if m else ''
          print("SHOP_CONTENT_TYPE=",ctype)
          print("SHOP_CONTENT_BYTES=",Path('/tmp/shop-content.bin').stat().st_size)

          if not r.get('main_module'):
              print("DIAG_RESULT=NO_MAIN_MODULE")
          elif 'multipart/' not in ctype.lower():
              print("DIAG_RESULT=CONTENT_NOT_MULTIPART")
          else:
              print("DIAG_RESULT=SHOP_SHAPE_OK")
          PY

      - name: Try materialize SHOP modules
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/shop-modules
          mkdir -p /tmp/shop-modules

          python3 - <<'PY'
          import json,re
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default

          settings=json.load(open('/tmp/shop-settings.json'))
          result=settings.get('result') or {}
          main=result.get('main_module')

          headers=Path('/tmp/shop-headers.txt').read_text(errors='ignore')
          body=Path('/tmp/shop-content.bin').read_bytes()
          m=re.search(r'content-type:\s*([^\r\n]+)',headers,re.I)
          ctype=m.group(1).strip() if m else ''

          if 'multipart/' not in ctype.lower():
              raise SystemExit("MATERIALIZE_FAIL: content is not multipart")

          raw=(f'Content-Type: {ctype}\r\nMIME-Version: 1.0\r\n\r\n').encode()+body
          msg=BytesParser(policy=default).parsebytes(raw)

          names=[]
          for part in msg.iter_parts():
              payload=part.get_payload(decode=True) or b''
              name=part.get_filename() or part.get_param('name',header='content-disposition')
              if not name or name=='metadata':
                  continue
              safe=Path(name).name
              (Path('/tmp/shop-modules')/safe).write_bytes(payload)
              names.append(safe)

          print("MATERIALIZED_MODULES=",names)
          print("EXPECTED_MAIN=",Path(main).name if main else None)

          if not names:
              raise SystemExit("MATERIALIZE_FAIL: no modules")
          if not main or Path(main).name not in names:
              raise SystemExit("MATERIALIZE_FAIL: main module missing")

          print("MATERIALIZE_QA=PASS")
          PY

      - name: Verify DAYCARE still unchanged
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'DAYCARE-3-R15-AUTO-ESCALATION-20260930' worker.js
          echo "DAYCARE_CURRENT=R15_UNCHANGED"

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "=== DPRO SHARED SCHEDULER DIAGNOSIS R2 ==="
          echo "This workflow made no source/deploy/cron changes."
