name: DPRO CHAT B DAYCARE Owner Guide Fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-chat-b-${{ github.repository }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Repository guard
        shell: bash
        run: |
          if [ "$GITHUB_REPOSITORY" != "dpromstk2000-lab/dpro-dayservice-line" ]; then
            echo "Wrong repository: expected dpromstk2000-lab/dpro-dayservice-line, got $GITHUB_REPOSITORY" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add role-correct owner return to Guide Center
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("guide-center.html")
          if not p.exists():
              raise SystemExit("guide-center.html not found")

          s = p.read_text(encoding="utf-8")
          before = s

          marker = """    window.addEventListener('DOMContentLoaded',()=>{render();document.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();location.assign('./index.html');}});});"""

          if "data-dpro-chat-b-owner-return-mode" not in s:
              if marker not in s:
                  raise SystemExit("guide-center DOMContentLoaded marker missing")

              replacement = """    window.addEventListener('DOMContentLoaded',()=>{
                const fromOwner=new URLSearchParams(location.search).get('from')==='owner';
                document.documentElement.setAttribute('data-dpro-chat-b-owner-return-mode',fromOwner?'owner':'public');
                const close=$('#guideClose');
                if(fromOwner&&close){
                  close.href='./owner.html';
                  close.textContent='Owner PCへ戻る';
                }
                render();
                document.addEventListener('keydown',e=>{
                  if(e.key==='Escape'){
                    e.preventDefault();
                    location.assign(fromOwner?'./owner.html':'./index.html');
                  }
                });
              });"""
              s = s.replace(marker, replacement, 1)

          required = [
              "data-dpro-chat-b-owner-return-mode",
              "new URLSearchParams(location.search).get('from')==='owner'",
              "close.href='./owner.html'",
              "close.textContent='Owner PCへ戻る'",
              "fromOwner?'./owner.html':'./index.html'",
              "guideStart",
              "guideResume",
              "guideReplay",
          ]
          for token in required:
              if token not in s:
                  raise SystemExit(f"guide-center result missing: {token}")

          if s != before:
              p.write_text(s, encoding="utf-8")

          print("DAYCARE GUIDE CENTER OWNER RETURN:", "CHANGED" if s != before else "ALREADY_OK")
          PY

      - name: Add restrained owner guide entry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("owner.html")
          if not p.exists():
              raise SystemExit("owner.html not found")

          guide = Path("guide-center.html")
          if not guide.exists():
              raise SystemExit("guide-center.html not found")

          gs = guide.read_text(encoding="utf-8")
          if "./owner.html" not in gs:
              raise SystemExit("guide-center.html has no Owner PC return path")
          for token in ["guideStart", "guideResume", "guideReplay"]:
              if token not in gs:
                  raise SystemExit(f"guide-center control missing: {token}")

          s = p.read_text(encoding="utf-8")
          before = s

          if "data-dpro-chat-b-guide" not in s:
              style = """
          <style id="dpro-chat-b-guide-style">
          .dpro-chat-b-guide-link{position:fixed;right:12px;bottom:12px;z-index:9999;display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 13px;border:1px solid rgba(0,0,0,.12);border-radius:999px;background:#fff;color:#17352c;text-decoration:none;font:800 13px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.12)}
          .dpro-chat-b-guide-link:focus-visible{outline:3px solid #ffbf47;outline-offset:3px}
          @media(max-width:700px){.dpro-chat-b-guide-link{bottom:72px;right:10px;min-height:40px;padding:7px 11px;font-size:12px}}
          </style>
          """
              link = """
          <a class="dpro-chat-b-guide-link" data-dpro-chat-b-guide href="guide-center.html?from=owner" aria-label="操作ガイドを開く">操作ガイド</a>
          """
              if "</head>" not in s or "</body>" not in s:
                  raise SystemExit("safe HTML insertion markers missing")
              s = s.replace("</head>", style + "</head>", 1)
              s = s.replace("</body>", link + "</body>", 1)

          if s.count("data-dpro-chat-b-guide") != 1:
              raise SystemExit("guide entry count is not exactly 1")
          if 'href="guide-center.html?from=owner"' not in s:
              raise SystemExit("owner-aware guide href missing")

          if s != before:
              p.write_text(s, encoding="utf-8")

          print("DAYCARE OWNER GUIDE ENTRY:", "CHANGED" if s != before else "ALREADY_OK")
          PY

      - name: Static guide QA
        shell: bash
        run: |
          grep -q 'data-dpro-chat-b-guide' owner.html
          grep -q 'href="guide-center.html?from=owner"' owner.html
          grep -q "close.href='./owner.html'" guide-center.html
          grep -q "fromOwner?'./owner.html':'./index.html'" guide-center.html
          grep -q 'guideResume' guide-center.html
          grep -q 'guideReplay' guide-center.html
          grep -q 'guideStart' guide-center.html
          echo 'DAYCARE OWNER GUIDE static QA: PASS'

      - name: Commit forward-only fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch ".github/workflows/dpro-chat-b-guide-daycare.yml"
          git add "owner.html" "guide-center.html"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix CHAT B DAYCARE owner guide return path"
          git push
