name: DPRO DAYCARE Broadcast History UX R1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch broadcast history UX
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          set -euo pipefail
          python -c 'import os,base64; exec(base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8"))'
          grep -q 'DPRO DAYCARE BROADCAST HISTORY UX R1 20260930' owner.html
          grep -q 'broadcastHistoryExpanded: false' owner.html
          grep -q 'data-broadcast-history-toggle' owner.html
          grep -q 'data-broadcast-history-focus' owner.html
          echo "STATIC_QA=PASS"

      - name: Commit owner.html
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add owner.html
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "DAYCARE broadcast history UX R1"
            git push origin HEAD:main
          fi

      - name: Summary
        shell: bash
        run: |
          {
            echo "## DPRO DAYCARE Broadcast History UX R1"
            echo ""
            echo "- Default history view: latest 3"
            echo "- Older history: collapsible"
            echo "- Each history card: expand / restore"
            echo "- Full message shown while expanded"
            echo "- Existing resend/escalation/cancel actions: preserved"
            echo "- Broadcast API/Worker logic: unchanged"
          } >> "$GITHUB_STEP_SUMMARY"
