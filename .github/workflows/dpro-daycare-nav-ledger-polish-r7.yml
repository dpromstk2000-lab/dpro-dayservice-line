name: DPRO DAYCARE Nav Ledger Polish R7

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brushup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply nav and ledger polish
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          python -c 'import os,base64; exec(base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8"))'

      - name: Validate owner source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'DPRO DAYCARE LEDGER USABILITY BRUSHUP R5' owner.html
          grep -q 'DPRO DAYCARE NAV / LEDGER POLISH R7' owner.html
          grep -q '利用者・ご家族を探す' owner.html
          grep -q '>未検索<' owner.html
          echo "STATIC_QA=PASS"

      - name: Update owner.html through GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          SHA=$(curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/contents/owner.html?ref=main"             | python -c 'import sys,json; print(json.load(sys.stdin)["sha"])')

          CONTENT=$(base64 -w 0 owner.html)

          python - "$SHA" "$CONTENT" > /tmp/payload.json <<'PY'
          import json,sys
          sha=sys.argv[1]
          content=sys.argv[2]
          print(json.dumps({
            "message":"DAYCARE nav and ledger polish R7",
            "content":content,
            "sha":sha,
            "branch":"main"
          }))
          PY

          curl -fsSL             -X PUT             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "Content-Type: application/json"             "https://api.github.com/repos/$REPO/contents/owner.html"             --data-binary @/tmp/payload.json             > /tmp/update.json

          python - <<'PY'
          import json
          d=json.load(open("/tmp/update.json"))
          commit=(d.get("commit") or {}).get("sha")
          content=(d.get("content") or {}).get("sha")
          if not commit or not content:
              raise SystemExit("ERROR: GitHub API update response missing commit/content sha")
          print("API_UPDATE=PASS")
          print("commit_sha="+commit)
          print("content_sha="+content)
          PY

      - name: Summary
        shell: bash
        run: |
          echo "## DPRO DAYCARE Nav Ledger Polish R7" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sidebar full-height navigation: reinforced" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ledger initial count: 0件 -> 未検索" >> "$GITHUB_STEP_SUMMARY"
          echo "- Search UI readability: improved" >> "$GITHUB_STEP_SUMMARY"
          echo "- Duplicate page-heading feeling: reduced" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit method: GitHub Contents API" >> "$GITHUB_STEP_SUMMARY"
          echo "- Existing APIs / LINE / broadcast behavior: unchanged" >> "$GITHUB_STEP_SUMMARY"
