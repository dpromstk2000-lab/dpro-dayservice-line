                            予約を取消
                          </button>` : ""}
                      </div>
                    </article>
                  `).join("");
                }

                async function loadBroadcastHistory() {
                  const data = await CONFIG.API.adminGet("adminBroadcastHistory");
                  state.broadcastHistory = data.broadcasts || [];
                  renderBroadcastHistory();
                }

                async function loadBroadcastSection() {
                  if (!state.broadcastTemplates.length) {
                    await loadBroadcastTemplates();
                  }
                  await loadBroadcastHistory();
                }

                async function resendBroadcast(sourceBroadcastId) {
                  const confirmed = window.confirm(
                    "この連絡を、まだ「確認しました」を押していないご家族だけへ再送します。よろしいですか？"
                  );
                  if (!confirmed) return;
                  const data = await CONFIG.API.adminPost(
