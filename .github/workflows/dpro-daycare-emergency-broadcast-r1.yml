                async function cancelBroadcast(broadcastId) {
                  const confirmed = window.confirm("この予約配信を取り消しますか？");
                  if (!confirmed) return;
                  const data = await CONFIG.API.adminPost(
                    "adminBroadcastCancel",
                    { broadcast_id: broadcastId }
                  );
                  showSuccess(data.message || "予約配信を取り消しました。");
                  await loadBroadcastHistory();
                }

          '''

