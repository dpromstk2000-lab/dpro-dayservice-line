                        / 未連携 ${row.unlinked_count || 0} / 確認済 ${row.acknowledged_count || 0}
                        <br>${escapeHtml(formatDateTime(row.sent_at || row.scheduled_at || row.created_at))}
                      </div>
                      <div class="toolbar" style="margin-top:8px">
                        ${["sent","partial"].includes(row.status) ? `
                          <button class="btn btn-secondary btn-small" type="button" data-resend-broadcast="${escapeHtml(row.id)}">
