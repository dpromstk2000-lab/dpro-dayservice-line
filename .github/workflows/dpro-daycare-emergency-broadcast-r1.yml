                function newIdempotencyKey(prefix) {
                  const random = window.crypto?.randomUUID
                    ? window.crypto.randomUUID()
                    : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
                  return `${prefix}-${random}`;
