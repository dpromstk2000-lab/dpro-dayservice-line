                      <div class="broadcast-metric"><span>対象利用者</span><strong>${counts.users || 0}</strong></div>
                      <div class="broadcast-metric"><span>対象家族</span><strong>${counts.families || 0}</strong></div>
                      <div class="broadcast-metric"><span>LINE送信可能</span><strong>${counts.line_deliverable || 0}</strong></div>
                      <div class="broadcast-metric"><span>LINE未連携</span><strong>${counts.line_unlinked || 0}</strong></div>
