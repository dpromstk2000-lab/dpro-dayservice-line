              },
            });
            if (!rows[0]) {
              throw new ApiError(404, "施設情報が見つかりません。");
            }
            return rows[0];
          }

          function addDaysIso(dateText, days) {
            const date = new Date(`${dateText}T12:00:00Z`);
            date.setUTCDate(date.getUTCDate() + Number(days || 0));
            return date.toISOString().slice(0, 10);
          }

