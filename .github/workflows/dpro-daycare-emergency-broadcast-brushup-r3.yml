name: DPRO DAYCARE Emergency Broadcast Brushup R3

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-daycare-emergency-broadcast-brushup-r3
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Protected source drift lock
        shell: bash
        run: |
          test "$(git rev-parse HEAD:worker.js)" = "5fd1b11f45069cb9b57a517d6a90b190e88647f0"
          test "$(git rev-parse HEAD:owner.html)" = "7c505c72d66040f1eb3f2e7b0aa108c5204fb56a"
          test "$(git rev-parse HEAD:config.js)" = "b82d18c32656bbd406fbb48572892a2fb1553603"
          echo "SOURCE DRIFT LOCK PASS"

      - name: Apply Brushup R3
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: marker count={count}")
              return text.replace(old, new, 1)

          worker = Path("worker.js").read_text(encoding="utf-8")
          owner = Path("owner.html").read_text(encoding="utf-8")
          config = Path("config.js").read_text(encoding="utf-8")

          # ---------------- versions ----------------
          worker = rep(
              worker,
              " * Version: DAYCARE-3-R6-EMERGENCY-BROADCAST-R1-20260925",
              " * Version: DAYCARE-3-R6-EMERGENCY-BROADCAST-R2-20260925",
              "worker header version",
          )
          worker = rep(
              worker,
              'const VERSION = "DAYCARE-3-R6-EMERGENCY-BROADCAST-R1-20260925";',
              'const VERSION = "DAYCARE-3-R6-EMERGENCY-BROADCAST-R2-20260925";',
              "worker runtime version",
          )
          worker = rep(
              worker,
              'const FRONTEND_VERSION = "DAYCARE screen set: FAMILY-6 / MEMBER-7 / OWNER-8-R3-BROADCAST / IPAD-9 / SYSTEM-CHECK-10";',
              'const FRONTEND_VERSION = "DAYCARE screen set: FAMILY-6 / MEMBER-7 / OWNER-8-R3-BROADCAST-R2 / IPAD-9 / SYSTEM-CHECK-10";',
              "worker frontend version",
          )

          config = rep(
              config,
              'appVersion: "DAYCARE-4-R3-EMERGENCY-BROADCAST-R1-20260925",',
              'appVersion: "DAYCARE-4-R3-EMERGENCY-BROADCAST-R2-20260925",',
              "config app version",
          )
          config = rep(
              config,
              'workerVersion: "DAYCARE-3-R6-EMERGENCY-BROADCAST-R1-20260925",',
              'workerVersion: "DAYCARE-3-R6-EMERGENCY-BROADCAST-R2-20260925",',
              "config worker version",
          )

          owner = rep(
              owner,
              'const SCREEN_VERSION = "DAYCARE-8-R3-EMERGENCY-BROADCAST-R1-20260925";',
              'const SCREEN_VERSION = "DAYCARE-8-R3-EMERGENCY-BROADCAST-R2-20260925";',
              "owner version",
          )

          # ---------------- fix 1: all-family user count ----------------
          worker = rep(
              worker,
          '''  families = families.filter((family) => family.contact_allowed !== false);

            const familyIds = families.map((family) => family.id);
            const deliveryTargets = familyIds.length
          ''',
          '''  families = families.filter((family) => family.contact_allowed !== false);

            const familyIds = families.map((family) => family.id);

            if (["all", "selected_families"].includes(targetType) && familyIds.length) {
              relations = await supabaseRequest(env, TABLES.userFamilies, {
                query: {
                  select: "user_id,family_member_id,is_primary_contact,is_active",
                  facility_id: `eq.${facility.id}`,
                  family_member_id: `in.(${familyIds.join(",")})`,
                  is_active: "eq.true",
                  limit: "4000",
                },
              });
              userIds = unique(relations.map((row) => row.user_id).filter(Boolean));
            }

            const deliveryTargets = familyIds.length
          ''',
              "all family user count",
          )

          # ---------------- fix 2: Japanese date display ----------------
          owner = rep(
              owner,
          '''    .date-picker-button input[type="date"] {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                margin: 0;
                opacity: 0;
                cursor: pointer;
              }
          ''',
          '''    .date-picker-button input[type="date"],
              .date-picker-button input[type="datetime-local"] {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                margin: 0;
                opacity: 0;
                cursor: pointer;
              }

              .broadcast-date-picker {
                width: 100%;
                min-height: 44px;
                justify-content: flex-start;
                font-size: 11px;
              }
          ''',
              "date picker css",
          )

          owner = rep(
              owner,
          '''                    <label for="broadcastDate">対象日</label>
                              <input class="input" id="broadcastDate" type="date">
          ''',
          '''                    <label for="broadcastDate">対象日</label>
                              <label class="date-picker-button broadcast-date-picker">
                                <span id="broadcastDateDisplay">日付を選択</span>
                                <input id="broadcastDate" type="date" aria-label="一斉連絡の対象日を選ぶ">
                              </label>
          ''',
              "target date html",
          )

          owner = rep(
              owner,
          '''                    <label for="broadcastScheduledAt">予約配信（任意）</label>
                              <input class="input" id="broadcastScheduledAt" type="datetime-local">
          ''',
          '''                    <label for="broadcastScheduledAt">予約配信（任意）</label>
                              <label class="date-picker-button broadcast-date-picker">
                                <span id="broadcastScheduledDisplay">予約日時を選択</span>
                                <input id="broadcastScheduledAt" type="datetime-local" aria-label="一斉連絡の予約配信日時を選ぶ">
                              </label>
          ''',
              "scheduled date html",
          )

          owner = rep(
              owner,
          '''        broadcastDate: $("#broadcastDate"),
                  broadcastTemplate: $("#broadcastTemplate"),
          ''',
          '''        broadcastDate: $("#broadcastDate"),
                  broadcastDateDisplay: $("#broadcastDateDisplay"),
                  broadcastTemplate: $("#broadcastTemplate"),
          ''',
              "date display element",
          )

          owner = rep(
              owner,
          '''        broadcastScheduledAt: $("#broadcastScheduledAt"),
                  broadcastPreviewButton: $("#broadcastPreviewButton"),
          ''',
          '''        broadcastScheduledAt: $("#broadcastScheduledAt"),
                  broadcastScheduledDisplay: $("#broadcastScheduledDisplay"),
                  broadcastPreviewButton: $("#broadcastPreviewButton"),
          ''',
              "schedule display element",
          )

          owner = rep(
              owner,
          '''      function formatTime(value) {
          ''',
          '''      function formatBroadcastDateJa(value) {
                  if (!value) return "日付を選択";
                  const [y, m, d] = String(value).split("-").map(Number);
                  if (![y, m, d].every(Number.isFinite)) return String(value);
                  const weekday = ["日", "月", "火", "水", "木", "金", "土"][
                    new Date(Date.UTC(y, m - 1, d, 12)).getUTCDay()
                  ];
                  return `${y}年${m}月${d}日（${weekday}）`;
                }

                function formatBroadcastDateTimeJa(value) {
                  if (!value) return "予約日時を選択";
                  const [datePart, timePart = ""] = String(value).split("T");
                  const dateLabel = formatBroadcastDateJa(datePart);
                  return timePart ? `${dateLabel} ${timePart.slice(0, 5)}` : dateLabel;
                }

                function updateBroadcastDateLabels() {
                  els.broadcastDateDisplay.textContent =
                    formatBroadcastDateJa(els.broadcastDate.value || today());
                  els.broadcastScheduledDisplay.textContent =
                    formatBroadcastDateTimeJa(els.broadcastScheduledAt.value);
                }

                function formatTime(value) {
          ''',
              "date formatting functions",
          )

          owner = rep(
              owner,
          '''        els.broadcastTemplate.addEventListener("change", applyBroadcastTemplate);
                  els.broadcastPreviewButton.addEventListener(
          ''',
          '''        els.broadcastTemplate.addEventListener("change", applyBroadcastTemplate);
                  els.broadcastDate.addEventListener("change", updateBroadcastDateLabels);
                  els.broadcastScheduledAt.addEventListener("change", updateBroadcastDateLabels);
                  els.broadcastPreviewButton.addEventListener(
          ''',
              "date events",
          )

          owner = rep(
              owner,
          '''        els.broadcastDate.value = todayText;
                  updateDateLabels();
          ''',
          '''        els.broadcastDate.value = todayText;
                  updateDateLabels();
                  updateBroadcastDateLabels();
          ''',
              "date init",
          )

          Path("worker.js").write_text(worker, encoding="utf-8")
          Path("owner.html").write_text(owner, encoding="utf-8")
          Path("config.js").write_text(config, encoding="utf-8")

          # Final static QA
          checks = [
              ("worker version", "DAYCARE-3-R6-EMERGENCY-BROADCAST-R2-20260925" in worker),
              ("all-family count", '["all", "selected_families"].includes(targetType)' in worker),
              ("owner version", "DAYCARE-8-R3-EMERGENCY-BROADCAST-R2-20260925" in owner),
              ("target date display", 'id="broadcastDateDisplay"' in owner),
              ("schedule display", 'id="broadcastScheduledDisplay"' in owner),
              ("date updater", "updateBroadcastDateLabels" in owner),
              ("config version", "DAYCARE-4-R3-EMERGENCY-BROADCAST-R2-20260925" in config),
          ]
          failed = [name for name, ok in checks if not ok]
          if failed:
              raise SystemExit("STATIC QA FAILED: " + ", ".join(failed))

          print("STATIC QA PASS")

          PY

      - name: QA
        shell: bash
        run: |
          cp worker.js /tmp/worker.mjs
          node --check /tmp/worker.mjs
          node --check config.js
          grep -q 'DAYCARE-3-R6-EMERGENCY-BROADCAST-R2-20260925' worker.js
          grep -q 'DAYCARE-8-R3-EMERGENCY-BROADCAST-R2-20260925' owner.html
          grep -q 'broadcastDateDisplay' owner.html
          grep -q 'broadcastScheduledDisplay' owner.html
          echo "BRUSHUP R3 QA PASS"

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch ".github/workflows/dpro-daycare-emergency-broadcast-brushup-r3.yml"
          git rm --ignore-unmatch ".github/workflows/dpro-daycare-emergency-broadcast-brushup-r2.yml"
          git add worker.js owner.html config.js
          git commit -m "Brush up DAYCARE emergency broadcast R2"
          git push
