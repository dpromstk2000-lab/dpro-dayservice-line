name: DPRO DAYCARE Family Contact Visibility R1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCRIPT_NAME: dpro-dayservice-line-api
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch worker and owner
        shell: bash
        env:
          WORKER_PATCH_B64: ""
          OWNER_PATCH_B64: ""
        run: |
          set -euo pipefail
          python -c 'import os,base64; exec(base64.b64decode(os.environ["WORKER_PATCH_B64"]).decode("utf-8"))'
          python -c 'import os,base64; exec(base64.b64decode(os.environ["OWNER_PATCH_B64"]).decode("utf-8"))'
          node --check worker.js
          grep -q 'DAYCARE-3-R9-FAMILY-CONTACT-VISIBILITY-20260930' worker.js
          grep -q 'DPRO DAYCARE FAMILY CONTACT VISIBILITY R1' owner.html
          echo "STATIC_QA=PASS"

      - name: Update repository files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for FILE in worker.js owner.html; do
            curl -fsSL               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$REPO/contents/$FILE?ref=main" > "/tmp/current-$FILE.json"

            FILE="$FILE" python - <<'PY' > "/tmp/payload-$FILE.json"
          import os,json,base64
          from pathlib import Path
          f=os.environ["FILE"]
          current=json.load(open("/tmp/current-"+f+".json",encoding="utf-8"))
          payload={
            "message":"DAYCARE family contact visibility R1: "+f,
            "content":base64.b64encode(Path(f).read_bytes()).decode("ascii"),
            "sha":current["sha"],
            "branch":"main"
          }
          print(json.dumps(payload,ensure_ascii=False))
          PY

            curl -fsSL -X PUT               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "Content-Type: application/json"               "https://api.github.com/repos/$REPO/contents/$FILE"               --data-binary @"/tmp/payload-$FILE.json" > "/tmp/update-$FILE.json"

            FILE="$FILE" python - <<'PY'
          import os,json
          f=os.environ["FILE"]
          d=json.load(open("/tmp/update-"+f+".json",encoding="utf-8"))
          if not (d.get("commit") or {}).get("sha"):
              raise SystemExit("GitHub update failed: "+f)
          print("UPDATED",f,(d.get("commit") or {}).get("sha"))
          PY
          done

      - name: Find Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN is missing'; exit 2; }
          curl -fsS -H "Authorization: Bearer $CF_TOKEN"             https://api.cloudflare.com/client/v4/accounts > /tmp/accounts.json
          python3 - <<'PY' > /tmp/account-ids
          import json
          d=json.load(open('/tmp/accounts.json'))
          for row in d.get('result') or []:
              if row.get('id'): print(row['id'])
          PY
          found=''
          while IFS= read -r aid; do
            [ -n "$aid" ] || continue
            echo "::add-mask::$aid"
            code=$(curl -sS -o /tmp/current-worker -w '%{http_code}'               -H "Authorization: Bearer $CF_TOKEN"               "https://api.cloudflare.com/client/v4/accounts/$aid/workers/scripts/$SCRIPT_NAME/content/v2")
            if [ "$code" = "200" ]; then found="$aid"; break; fi
          done < /tmp/account-ids
          [ -n "$found" ] || { echo 'Target Worker not found'; exit 3; }
          printf '%s' "$found" > /tmp/dpro-account-id

      - name: Deploy R9 Worker
        shell: bash
        run: |
          set -euo pipefail
          aid=$(cat /tmp/dpro-account-id)
          code=$(curl -sS -o /tmp/deploy.json -w '%{http_code}'             -X PUT             -H "Authorization: Bearer $CF_TOKEN"             -F 'metadata={"main_module":"worker.js"};type=application/json'             -F 'worker.js=@worker.js;type=application/javascript+module'             "https://api.cloudflare.com/client/v4/accounts/$aid/workers/scripts/$SCRIPT_NAME/content")
          echo "HTTP $code"
          [ "$code" = "200" ] || { cat /tmp/deploy.json; exit 4; }

      - name: Live smoke check
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time,urllib.request
          api='https://dpro-dayservice-line-api.dpromstk2000.workers.dev/api/health'
          expected='DAYCARE-3-R9-FAMILY-CONTACT-VISIBILITY-20260930'
          last={}
          for _ in range(15):
              with urllib.request.urlopen(api,timeout=25) as r:
                  last=json.loads(r.read().decode())
              if last.get('workerVersion')==expected:
                  break
              time.sleep(2)
          else:
              raise SystemExit("R9 Worker did not become live: "+repr(last.get('workerVersion')))
          if last.get('databaseVersion')!='DAYCARE-DB-R3-20260925-EMERGENCY-BROADCAST-01':
              raise SystemExit("database version mismatch")
          print(json.dumps({"ok":True,"workerVersion":last.get("workerVersion"),"databaseVersion":last.get("databaseVersion")},ensure_ascii=False))
          PY

      - name: Summary
        shell: bash
        run: |
          echo "## DPRO DAYCARE Family Contact Visibility R1" >> "$GITHUB_STEP_SUMMARY"
          echo "- Real LINE link status added to user detail API" >> "$GITHUB_STEP_SUMMARY"
          echo "- Normal / emergency / priority / staged-delivery settings visible in ledger" >> "$GITHUB_STEP_SUMMARY"
          echo "- R9 Worker deployed and smoke-checked" >> "$GITHUB_STEP_SUMMARY"
