name: DPRO DAYCARE Final Demo Polish R1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch owner demo labels
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          set -euo pipefail
          python -c 'import os,base64; exec(base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8"))'

          grep -q 'DPRO DAYCARE FINAL DEMO POLISH R1 20260930' owner.html
          grep -q 'const subjectLabel = cleanDemoLabel' owner.html
          echo "STATIC_QA=PASS"

      - name: Commit owner.html
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add owner.html

          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "DAYCARE final demo polish R1"
            git push origin HEAD:main
          fi

      - name: Turn demo auto escalation OFF
        shell: bash
        run: |
          set -euo pipefail

          body='{"facility_code":"dpro_dayservice_demo","enabled":false,"delay_minutes":5,"max_priority":2,"operator_name":"公開デモ最終QA","device_type":"github-actions"}'

          code=$(curl -sS -o /tmp/off.json -w '%{http_code}'             -X POST             -H 'Accept: application/json'             -H 'Content-Type: application/json'             -H 'X-Admin-Code: 1234'             --data "$body"             'https://dpro-dayservice-line-api.dpromstk2000.workers.dev/api/admin/broadcasts/auto-escalation/settings')

          echo "AUTO_ESCALATION_OFF_HTTP=$code"
          cat /tmp/off.json
          [ "$code" = "200" ] || exit 6

      - name: Verify demo setting OFF
        shell: bash
        run: |
          set -euo pipefail

          curl -fsS             -H 'Accept: application/json'             -H 'X-Admin-Code: 1234'             'https://dpro-dayservice-line-api.dpromstk2000.workers.dev/api/admin/broadcasts/auto-escalation/settings?facility_code=dpro_dayservice_demo'             > /tmp/settings.json

          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/settings.json'))
          settings=d.get('settings') or {}
          print("AUTO_ESCALATION_ENABLED=", settings.get('enabled'))
          print("AUTO_ESCALATION_DELAY_MINUTES=", settings.get('delay_minutes'))
          print("AUTO_ESCALATION_MAX_PRIORITY=", settings.get('max_priority'))
          if settings.get('enabled') is not False:
              raise SystemExit("ERROR: demo auto escalation is still enabled")
          print("AUTO_ESCALATION_OFF_QA=PASS")
          PY

      - name: Summary
        shell: bash
        run: |
          {
            echo "## DPRO DAYCARE Final Demo Polish R1"
            echo ""
            echo "- Duplicate 【デモ】 title rendering: fixed"
            echo "- Demo auto escalation: OFF"
            echo "- Existing R16 shared scheduler: unchanged"
            echo "- Broadcast logic/API: unchanged"
          } >> "$GITHUB_STEP_SUMMARY"
