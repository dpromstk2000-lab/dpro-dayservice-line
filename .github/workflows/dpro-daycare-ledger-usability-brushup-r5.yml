name: DPRO DAYCARE Ledger Usability Brushup R5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brushup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply ledger usability patch
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          python -c 'import os,base64; exec(base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8"))'

      - name: Validate owner source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'DPRO DAYCARE READABILITY BRUSHUP R2' owner.html
          grep -q 'DPRO DAYCARE LEDGER USABILITY BRUSHUP R5' owner.html
          grep -q '利用者・家族台帳' owner.html
          grep -q 'ご家族・LINE連携' owner.html
          echo "STATIC_QA=PASS"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- owner.html; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add owner.html
          git commit -m "DAYCARE ledger usability brushup R5"
          git push origin HEAD:main

      - name: Summary
        shell: bash
        run: |
          echo "## DPRO DAYCARE Ledger Usability Brushup R5" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public demo banner clipping: fixed" >> "$GITHUB_STEP_SUMMARY"
          echo "- 利用者・家族台帳: upgraded" >> "$GITHUB_STEP_SUMMARY"
          echo "- Family / contact / LINE status presentation: added" >> "$GITHUB_STEP_SUMMARY"
          echo "- Existing APIs and broadcast behavior: unchanged" >> "$GITHUB_STEP_SUMMARY"
          echo "- Static QA: PASS" >> "$GITHUB_STEP_SUMMARY"
