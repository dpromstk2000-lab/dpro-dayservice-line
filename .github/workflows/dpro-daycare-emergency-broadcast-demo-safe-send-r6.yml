name: DPRO DAYCARE Emergency Broadcast Demo Safe Send R6

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-daycare-emergency-broadcast-demo-safe-send-r6
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Protected source drift lock
        shell: bash
        run: |
          test "$(git rev-parse HEAD:worker.js)" = "a91610d4d42916d6f9af95dc7699e62b0effe871"
          test "$(git rev-parse HEAD:owner.html)" = "d44bf807315cab7cbbcebc62ad55d0abf2760396"
          test "$(git rev-parse HEAD:config.js)" = "d9ff4ece2fce382258ca185b8cac8fd06f76c165"
          echo "SOURCE DRIFT LOCK PASS"

      - name: Apply demo safe send R6
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: marker count={count}")
              return text.replace(old, new, 1)

          worker = Path("worker.js").read_text(encoding="utf-8")
          owner = Path("owner.html").read_text(encoding="utf-8")
          config = Path("config.js").read_text(encoding="utf-8")

          # ============================================================
          # Version bumps
          # ============================================================

          worker = rep(
              worker,
              " * Version: DAYCARE-3-R6-EMERGENCY-BROADCAST-R2-20260925",
              " * Version: DAYCARE-3-R7-EMERGENCY-BROADCAST-DEMO-SAFE-20260925",
              "worker header version",
          )
          worker = rep(
              worker,
              'const VERSION = "DAYCARE-3-R6-EMERGENCY-BROADCAST-R2-20260925";',
              'const VERSION = "DAYCARE-3-R7-EMERGENCY-BROADCAST-DEMO-SAFE-20260925";',
              "worker runtime version",
          )
          worker = rep(
              worker,
              'const FRONTEND_VERSION = "DAYCARE screen set: FAMILY-6 / MEMBER-7 / OWNER-8-R3-BROADCAST-R2 / IPAD-9 / SYSTEM-CHECK-10";',
              'const FRONTEND_VERSION = "DAYCARE screen set: FAMILY-6 / MEMBER-7 / OWNER-8-R5-BROADCAST-DEMO-SAFE / IPAD-9 / SYSTEM-CHECK-10";',
              "worker frontend version",
          )

          owner = rep(
              owner,
              'const SCREEN_VERSION = "DAYCARE-8-R4-EMERGENCY-BROADCAST-TARGET-SELECTION-20260925";',
              'const SCREEN_VERSION = "DAYCARE-8-R5-EMERGENCY-BROADCAST-DEMO-SAFE-20260925";',
              "owner version",
          )

          config = rep(
              config,
              'appVersion: "DAYCARE-4-R3-EMERGENCY-BROADCAST-R2-20260925",',
              'appVersion: "DAYCARE-4-R4-EMERGENCY-BROADCAST-DEMO-SAFE-20260925",',
              "config app version",
          )
          config = rep(
              config,
              'workerVersion: "DAYCARE-3-R6-EMERGENCY-BROADCAST-R2-20260925",',
              'workerVersion: "DAYCARE-3-R7-EMERGENCY-BROADCAST-DEMO-SAFE-20260925",',
              "config worker version",
          )

          # ============================================================
          # Worker: demo-safe helpers
          # ============================================================

          worker = rep(
              worker,
          '''function ensureProductionBroadcastAllowed(facility) {
            if (
              facility?.is_demo === true
              || facility?.facility_code === DEFAULT_FACILITY_CODE
            ) {
              throw new ApiError(
                409,
                "公開デモ環境から本番LINE送信はできません。",
                { code: "demo_broadcast_blocked" },
              );
            }
          }
          ''',
          '''function isDemoBroadcastFacility(facility) {
            return (
              facility?.is_demo === true
              || facility?.facility_code === DEFAULT_FACILITY_CODE
            );
          }

          function ensureProductionBroadcastAllowed(facility) {
            if (isDemoBroadcastFacility(facility)) {
              throw new ApiError(
                409,
                "公開デモ環境から本番LINE送信はできません。",
                { code: "demo_broadcast_blocked" },
              );
            }
          }
          ''',
              "demo helper",
          )

          # ============================================================
          # Worker: test send becomes simulated in public demo
          # ============================================================

          worker = rep(
              worker,
          '''async function handleAdminBroadcastTest(env, facility, body) {
            const content = normalizeBroadcastContent(body);
            const token = requireLineMessagingToken(env);
            const testUserId = cleanText(env.LINE_TEST_USER_ID, 200);
            if (!testUserId) {
              throw new ApiError(409, "テスト送信先LINE User IDが未設定です。", {
                code: "line_test_user_not_configured",
              });
            }

            const text = composeBroadcastText(content, null, true);
            const result = await sendLinePush(token, testUserId, text);

            await logOperation(env, {
              facilityId: facility.id,
              actorType: "staff",
              actorName: cleanText(body.operator_name, 100) || "管理者",
              action: "broadcast_test_send",
              targetTable: TABLES.broadcasts,
              deviceType: cleanDeviceType(body.device_type),
              isDemo: Boolean(facility.is_demo),
              details: {
                success: result.ok,
                status: result.status,
              },
            });

            if (!result.ok) {
              throw new ApiError(502, "LINEテスト送信に失敗しました。", {
                code: "line_test_send_failed",
                status: result.status,
              });
            }

            return {
              ok: true,
              service: SERVICE_NAME,
              version: VERSION,
              message: "テスト送信が完了しました。",
            };
          }
          ''',
          '''async function handleAdminBroadcastTest(env, facility, body) {
            const content = normalizeBroadcastContent(body);

            if (isDemoBroadcastFacility(facility)) {
              await logOperation(env, {
                facilityId: facility.id,
                actorType: "staff",
                actorName: cleanText(body.operator_name, 100) || "管理者",
                action: "broadcast_demo_test_send",
                targetTable: TABLES.broadcasts,
                deviceType: cleanDeviceType(body.device_type),
                isDemo: true,
                details: {
                  simulated: true,
                  subject: content.subject,
                  external_line_sent: false,
                },
              });

              return {
                ok: true,
                simulated: true,
                external_line_sent: false,
                service: SERVICE_NAME,
                version: VERSION,
                message: "デモ用テスト送信を確認しました。実際のLINEには送信されません。",
              };
            }

            const token = requireLineMessagingToken(env);
            const testUserId = cleanText(env.LINE_TEST_USER_ID, 200);
            if (!testUserId) {
              throw new ApiError(409, "テスト送信先LINE User IDが未設定です。", {
                code: "line_test_user_not_configured",
              });
            }

            const text = composeBroadcastText(content, null, true);
            const result = await sendLinePush(token, testUserId, text);

            await logOperation(env, {
              facilityId: facility.id,
              actorType: "staff",
              actorName: cleanText(body.operator_name, 100) || "管理者",
              action: "broadcast_test_send",
              targetTable: TABLES.broadcasts,
              deviceType: cleanDeviceType(body.device_type),
              isDemo: false,
              details: {
                success: result.ok,
                status: result.status,
              },
            });

            if (!result.ok) {
              throw new ApiError(502, "LINEテスト送信に失敗しました。", {
                code: "line_test_send_failed",
                status: result.status,
              });
            }

            return {
              ok: true,
              simulated: false,
              external_line_sent: true,
              service: SERVICE_NAME,
              version: VERSION,
              message: "テスト送信が完了しました。",
            };
          }
          ''',
              "demo test send",
          )

          # ============================================================
          # Worker: simulated dispatcher
          # ============================================================

          worker = rep(
              worker,
          '''async function dispatchBroadcastRow(env, facility, broadcast, targets) {
          ''',
          '''async function dispatchDemoBroadcastRow(env, facility, broadcast, targets) {
            const now = new Date().toISOString();

            const recipientPayloads = targets.recipients.map((recipient) => ({
              broadcast_id: broadcast.id,
              facility_id: facility.id,
              user_id: recipient.user_id,
              family_member_id: recipient.family_member_id,
              delivery_target_id: recipient.delivery_target_id || null,
              delivery_channel: "line",
              send_status: "sent",
              sent_at: now,
            }));

            if (recipientPayloads.length) {
              await supabaseRequest(env, TABLES.broadcastRecipients, {
                method: "POST",
                body: recipientPayloads,
                prefer: "return=minimal",
              });
            }

            const updated = await supabaseRequest(env, TABLES.broadcasts, {
              method: "PATCH",
              query: {
                id: `eq.${broadcast.id}`,
              },
              body: {
                status: "sent",
                sent_at: now,
                success_count: targets.family_count,
                failed_count: 0,
                target_user_count: targets.user_count,
                target_family_count: targets.family_count,
                deliverable_count: targets.deliverable_count,
                unlinked_count: targets.unlinked_count,
                line_request_summary: {
                  mode: "demo_safe_send",
                  external_line_sent: false,
                  simulated_recipients: targets.family_count,
                },
              },
              prefer: "return=representation",
            });

            await logOperation(env, {
              facilityId: facility.id,
              actorType: "staff",
              actorName: broadcast.created_by || "管理者",
              action: "broadcast_demo_safe_send",
              targetTable: TABLES.broadcasts,
              targetId: broadcast.id,
              deviceType: "api",
              isDemo: true,
              details: {
                simulated: true,
                external_line_sent: false,
                target_user_count: targets.user_count,
                target_family_count: targets.family_count,
                unlinked_count: targets.unlinked_count,
              },
            });

            return {
              broadcast: updated[0],
              success_count: targets.family_count,
              failed_count: 0,
              unlinked_count: targets.unlinked_count,
              simulated: true,
              external_line_sent: false,
              unlinked_families: targets.unlinked.map((row) => ({
                family_member_id: row.family_member_id,
                family_name: row.family_name,
                relationship: row.relationship,
                phone: row.phone,
              })),
            };
          }

          async function dispatchBroadcastRow(env, facility, broadcast, targets) {
          ''',
              "demo dispatcher insertion",
          )

          # ============================================================
          # Worker: immediate send
          # ============================================================

          worker = rep(
              worker,
          '''async function handleAdminBroadcastSend(env, facility, body) {
            ensureProductionBroadcastAllowed(facility);
            const targets = await resolveBroadcastRecipients(
              env,
              facility,
              body,
              { includeSecrets: true },
            );
            if (!targets.deliverable_count) {
              throw new ApiError(400, "LINE送信可能なご家族がいません。");
            }

            const created = await createBroadcastRow(
              env,
              facility,
              body,
              targets,
              "sending",
            );

            if (created.duplicate) {
              return {
                ok: true,
                duplicate: true,
                service: SERVICE_NAME,
                version: VERSION,
                message: "同じ送信処理はすでに受付済みです。",
                broadcast: sanitizeBroadcast(created.row),
              };
            }

            const result = await dispatchBroadcastRow(
              env,
              facility,
              created.row,
              targets,
            );

            return {
              ok: true,
              service: SERVICE_NAME,
              version: VERSION,
              message: result.failed_count
                ? "一斉連絡を送信しましたが、一部送信に失敗しました。"
                : "一斉連絡を送信しました。",
              ...result,
              broadcast: sanitizeBroadcast(result.broadcast),
            };
          }
          ''',
          '''async function handleAdminBroadcastSend(env, facility, body) {
            const demoMode = isDemoBroadcastFacility(facility);

            if (!demoMode) {
              ensureProductionBroadcastAllowed(facility);
            }

            const targets = await resolveBroadcastRecipients(
              env,
              facility,
              body,
              { includeSecrets: !demoMode },
            );

            if (demoMode) {
              if (!targets.family_count) {
                throw new ApiError(400, "送信対象のご家族がいません。");
              }

              const demoBody = {
                ...body,
                broadcast_type: body.broadcast_type === "resend_unacknowledged"
                  ? "demo_resend"
                  : "demo_simulated",
              };

              const created = await createBroadcastRow(
                env,
                facility,
                demoBody,
                targets,
                "sending",
              );

              if (created.duplicate) {
                return {
                  ok: true,
                  duplicate: true,
                  simulated: true,
                  external_line_sent: false,
                  service: SERVICE_NAME,
                  version: VERSION,
                  message: "同じデモ疑似送信はすでに受付済みです。",
                  broadcast: sanitizeBroadcast(created.row),
                };
              }

              const result = await dispatchDemoBroadcastRow(
                env,
                facility,
                created.row,
                targets,
              );

              return {
                ok: true,
                service: SERVICE_NAME,
                version: VERSION,
                message: "デモ疑似送信が完了しました。実際のLINEには送信されていません。",
                ...result,
                broadcast: sanitizeBroadcast(result.broadcast),
              };
            }

            if (!targets.deliverable_count) {
              throw new ApiError(400, "LINE送信可能なご家族がいません。");
            }

            const created = await createBroadcastRow(
              env,
              facility,
              body,
              targets,
              "sending",
            );

            if (created.duplicate) {
              return {
                ok: true,
                duplicate: true,
                simulated: false,
                external_line_sent: true,
                service: SERVICE_NAME,
                version: VERSION,
                message: "同じ送信処理はすでに受付済みです。",
                broadcast: sanitizeBroadcast(created.row),
              };
            }

            const result = await dispatchBroadcastRow(
              env,
              facility,
              created.row,
              targets,
            );

            return {
              ok: true,
              service: SERVICE_NAME,
              version: VERSION,
              message: result.failed_count
                ? "一斉連絡を送信しましたが、一部送信に失敗しました。"
                : "一斉連絡を送信しました。",
              simulated: false,
              external_line_sent: true,
              ...result,
              broadcast: sanitizeBroadcast(result.broadcast),
            };
          }
          ''',
              "demo immediate send",
          )

          # ============================================================
          # Worker: resend allows demo simulation
          # ============================================================

          worker = rep(
              worker,
          '''async function handleAdminBroadcastResend(env, facility, body) {
            ensureProductionBroadcastAllowed(facility);
          ''',
          '''async function handleAdminBroadcastResend(env, facility, body) {
            if (!isDemoBroadcastFacility(facility)) {
              ensureProductionBroadcastAllowed(facility);
            }
          ''',
              "demo resend",
          )

          # ============================================================
          # Worker: schedule allows demo reservation
          # ============================================================

          worker = rep(
              worker,
          '''async function handleAdminBroadcastSchedule(env, facility, body) {
            ensureProductionBroadcastAllowed(facility);
            const scheduledAt = cleanText(body.scheduled_at, 100);
            const scheduledDate = new Date(scheduledAt);
            if (!scheduledAt || Number.isNaN(scheduledDate.getTime())) {
              throw new ApiError(400, "予約配信日時を確認してください。");
            }
            if (scheduledDate.getTime() <= Date.now() + 60_000) {
              throw new ApiError(400, "予約配信は現在時刻より後を指定してください。");
            }

            normalizeBroadcastContent(body);
            const targets = await resolveBroadcastRecipients(env, facility, body);
            if (!targets.deliverable_count) {
              throw new ApiError(400, "LINE送信可能なご家族がいません。");
            }

            const created = await createBroadcastRow(
              env,
              facility,
              body,
              targets,
              "scheduled",
              { scheduledAt: scheduledDate.toISOString() },
            );

            return {
              ok: true,
              duplicate: created.duplicate,
              service: SERVICE_NAME,
              version: VERSION,
              message: created.duplicate
                ? "同じ予約配信はすでに受付済みです。"
                : "一斉連絡を予約しました。",
              broadcast: sanitizeBroadcast(created.row),
            };
          }
          ''',
          '''async function handleAdminBroadcastSchedule(env, facility, body) {
            const demoMode = isDemoBroadcastFacility(facility);

            if (!demoMode) {
              ensureProductionBroadcastAllowed(facility);
            }

            const scheduledAt = cleanText(body.scheduled_at, 100);
            const scheduledDate = new Date(scheduledAt);
            if (!scheduledAt || Number.isNaN(scheduledDate.getTime())) {
              throw new ApiError(400, "予約配信日時を確認してください。");
            }
            if (scheduledDate.getTime() <= Date.now() + 60_000) {
              throw new ApiError(400, "予約配信は現在時刻より後を指定してください。");
            }

            normalizeBroadcastContent(body);
            const targets = await resolveBroadcastRecipients(env, facility, body);

            if (demoMode) {
              if (!targets.family_count) {
                throw new ApiError(400, "送信対象のご家族がいません。");
              }
            } else if (!targets.deliverable_count) {
              throw new ApiError(400, "LINE送信可能なご家族がいません。");
            }

            const scheduleBody = demoMode
              ? { ...body, broadcast_type: "demo_scheduled" }
              : body;

            const created = await createBroadcastRow(
              env,
              facility,
              scheduleBody,
              targets,
              "scheduled",
              { scheduledAt: scheduledDate.toISOString() },
            );

            return {
              ok: true,
              duplicate: created.duplicate,
              simulated: demoMode,
              external_line_sent: false,
              service: SERVICE_NAME,
              version: VERSION,
              message: created.duplicate
                ? "同じ予約配信はすでに受付済みです。"
                : demoMode
                  ? "デモ予約を登録しました。実際のLINEには送信されません。"
                  : "一斉連絡を予約しました。",
              broadcast: sanitizeBroadcast(created.row),
            };
          }
          ''',
              "demo schedule",
          )

          # ============================================================
          # Worker: scheduled processor simulates demo instead of failing
          # ============================================================

          worker = rep(
              worker,
          '''        const facility = await getFacilityById(env, broadcast.facility_id);
                  ensureProductionBroadcastAllowed(facility);
                  const targets = await resolveBroadcastRecipients(
                    env,
                    facility,
                    {
                      target_type: broadcast.target_type,
                      target_filter: broadcast.target_filter || {},
                    },
                    { includeSecrets: true },
                  );

                  if (!targets.deliverable_count) {
                    await supabaseRequest(env, TABLES.broadcasts, {
                      method: "PATCH",
                      query: { id: `eq.${broadcast.id}` },
                      body: {
                        status: "failed",
                        failed_count: 0,
                        error_summary: { code: "no_deliverable_recipients" },
                      },
                      prefer: "return=minimal",
                    });
                    continue;
                  }

                  await dispatchBroadcastRow(env, facility, claimed[0], targets);
          ''',
          '''        const facility = await getFacilityById(env, broadcast.facility_id);
                  const demoMode = isDemoBroadcastFacility(facility);

                  if (!demoMode) {
                    ensureProductionBroadcastAllowed(facility);
                  }

                  const targets = await resolveBroadcastRecipients(
                    env,
                    facility,
                    {
                      target_type: broadcast.target_type,
                      target_filter: broadcast.target_filter || {},
                    },
                    { includeSecrets: !demoMode },
                  );

                  if (demoMode) {
                    if (!targets.family_count) {
                      await supabaseRequest(env, TABLES.broadcasts, {
                        method: "PATCH",
                        query: { id: `eq.${broadcast.id}` },
                        body: {
                          status: "failed",
                          failed_count: 0,
                          error_summary: { code: "no_demo_recipients" },
                        },
                        prefer: "return=minimal",
                      });
                      continue;
                    }

                    await dispatchDemoBroadcastRow(
                      env,
                      facility,
                      claimed[0],
                      targets,
                    );
                    continue;
                  }

                  if (!targets.deliverable_count) {
                    await supabaseRequest(env, TABLES.broadcasts, {
                      method: "PATCH",
                      query: { id: `eq.${broadcast.id}` },
                      body: {
                        status: "failed",
                        failed_count: 0,
                        error_summary: { code: "no_deliverable_recipients" },
                      },
                      prefer: "return=minimal",
                    });
                    continue;
                  }

                  await dispatchBroadcastRow(env, facility, claimed[0], targets);
          ''',
              "demo scheduled processor",
          )

          # ============================================================
          # Owner: demo helper
          # ============================================================

          owner = rep(
              owner,
          '''      function broadcastPayload() {
          ''',
          '''      function isPublicDemoBroadcast() {
                  return CONFIG?.APP?.facilityCode === "dpro_dayservice_demo";
                }

                function broadcastPayload() {
          ''',
              "owner demo helper",
          )

          # ============================================================
          # Owner: preview banner
          # ============================================================

          owner = rep(
              owner,
          '''          </div>
                    ${unlinked.length ? `
          ''',
          '''          </div>
                    ${isPublicDemoBroadcast() ? `
                      <div class="broadcast-warning" style="margin-top:10px">
                        <strong>公開デモ：実際のLINEには送信されません。</strong>
                        <p style="margin:5px 0 0">
                          「本送信」や「予約配信」を操作すると、疑似送信・疑似予約として履歴に記録されます。
                        </p>
                      </div>
                    ` : ""}
                    ${unlinked.length ? `
          ''',
              "owner demo preview note",
          )

          # ============================================================
          # Owner: immediate send
          # ============================================================

          owner = rep(
              owner,
          '''      async function sendBroadcast() {
                  const preview = await previewBroadcast();
                  const counts = preview.counts || {};
                  if (!counts.line_deliverable) {
                    throw new Error("LINE送信可能なご家族がいません。");
                  }

                  const emergencyNote = els.broadcastPriority.value === "emergency"
                    ? "\\n\\nこれは「緊急」連絡です。"
                    : "";
                  const confirmed = window.confirm(
                    `${counts.line_deliverable}名へLINEを送信します。`
                    + `\\nLINE未連携: ${counts.line_unlinked || 0}名`
                    + emergencyNote
                    + "\\n\\n送信してよろしいですか？"
                  );
                  if (!confirmed) return;

                  const data = await CONFIG.API.adminPost(
                    "adminBroadcastSend",
                    {
                      ...broadcastPayload(),
                      idempotency_key: newIdempotencyKey("send"),
                    }
                  );
                  showSuccess(data.message || "一斉連絡を送信しました。");
                  await Promise.all([loadBroadcastHistory(), previewBroadcast()]);
                }
          ''',
          '''      async function sendBroadcast() {
                  const preview = await previewBroadcast();
                  const counts = preview.counts || {};
                  const demoMode = isPublicDemoBroadcast();
                  const sendableCount = demoMode
                    ? (counts.families || 0)
                    : (counts.line_deliverable || 0);

                  if (!sendableCount) {
                    throw new Error(
                      demoMode
                        ? "送信対象のご家族がいません。"
                        : "LINE送信可能なご家族がいません。"
                    );
                  }

                  const emergencyNote = els.broadcastPriority.value === "emergency"
                    ? "\\n\\nこれは「緊急」連絡です。"
                    : "";

                  const confirmed = window.confirm(
                    demoMode
                      ? `${sendableCount}名へのデモ疑似送信を記録します。`
                        + "\\n実際のLINEには送信されません。"
                        + emergencyNote
                        + "\\n\\n疑似送信を実行しますか？"
                      : `${sendableCount}名へLINEを送信します。`
                        + `\\nLINE未連携: ${counts.line_unlinked || 0}名`
                        + emergencyNote
                        + "\\n\\n送信してよろしいですか？"
                  );
                  if (!confirmed) return;

                  const data = await CONFIG.API.adminPost(
                    "adminBroadcastSend",
                    {
                      ...broadcastPayload(),
                      idempotency_key: newIdempotencyKey("send"),
                    }
                  );
                  showSuccess(data.message || "一斉連絡を送信しました。");
                  await Promise.all([loadBroadcastHistory(), previewBroadcast()]);
                }
          ''',
              "owner demo immediate send",
          )

          # ============================================================
          # Owner: schedule
          # ============================================================

          owner = rep(
              owner,
          '''      async function scheduleBroadcast() {
                  const scheduledAt = els.broadcastScheduledAt.value;
                  if (!scheduledAt) {
                    throw new Error("予約配信日時を入力してください。");
                  }
                  const preview = await previewBroadcast();
                  if (!(preview.counts?.line_deliverable > 0)) {
                    throw new Error("LINE送信可能なご家族がいません。");
                  }

                  const confirmed = window.confirm(
                    `${formatDateTime(scheduledAt)}に一斉連絡を予約します。よろしいですか？`
                  );
                  if (!confirmed) return;

                  const data = await CONFIG.API.adminPost(
                    "adminBroadcastSchedule",
                    {
                      ...broadcastPayload(),
                      scheduled_at: new Date(scheduledAt).toISOString(),
                      idempotency_key: newIdempotencyKey("schedule"),
                    }
                  );
                  showSuccess(data.message || "予約配信しました。");
                  await loadBroadcastHistory();
                }
          ''',
          '''      async function scheduleBroadcast() {
                  const scheduledAt = els.broadcastScheduledAt.value;
                  if (!scheduledAt) {
                    throw new Error("予約配信日時を入力してください。");
                  }

                  const preview = await previewBroadcast();
                  const demoMode = isPublicDemoBroadcast();
                  const sendableCount = demoMode
                    ? (preview.counts?.families || 0)
                    : (preview.counts?.line_deliverable || 0);

                  if (!sendableCount) {
                    throw new Error(
                      demoMode
                        ? "送信対象のご家族がいません。"
                        : "LINE送信可能なご家族がいません。"
                    );
                  }

                  const confirmed = window.confirm(
                    demoMode
                      ? `${formatDateTime(scheduledAt)}にデモ予約を登録します。`
                        + "\\n実際のLINEには送信されません。"
                        + "\\n\\n予約しますか？"
                      : `${formatDateTime(scheduledAt)}に一斉連絡を予約します。よろしいですか？`
                  );
                  if (!confirmed) return;

                  const data = await CONFIG.API.adminPost(
                    "adminBroadcastSchedule",
                    {
                      ...broadcastPayload(),
                      scheduled_at: new Date(scheduledAt).toISOString(),
                      idempotency_key: newIdempotencyKey("schedule"),
                    }
                  );
                  showSuccess(data.message || "予約配信しました。");
                  await loadBroadcastHistory();
                }
          ''',
              "owner demo schedule",
          )

          # ============================================================
          # Owner: history labeling
          # ============================================================

          owner = rep(
              owner,
          '''        els.broadcastHistory.innerHTML = rows.map((row) => `
                    <article class="broadcast-history-item">
                      <div class="broadcast-history-head">
                        <h4>${escapeHtml(row.subject || "件名なし")}</h4>
                        <span class="status-pill status-${row.status === "sent" ? "ok" : row.status === "failed" ? "error" : "neutral"}">
                          ${escapeHtml(broadcastStatusLabel(row.status))}
                        </span>
                      </div>
                      <p>${escapeHtml((row.message_body || "").slice(0, 140))}</p>
                      <div class="broadcast-history-meta">
                        対象 ${row.target_family_count || 0} / 送信成功 ${row.success_count || 0}
                        / 未連携 ${row.unlinked_count || 0} / 確認済 ${row.acknowledged_count || 0}
                        <br>${escapeHtml(formatDateTime(row.sent_at || row.scheduled_at || row.created_at))}
                      </div>
                      <div class="toolbar" style="margin-top:8px">
                        ${["sent","partial"].includes(row.status) ? `
                          <button class="btn btn-secondary btn-small" type="button" data-resend-broadcast="${escapeHtml(row.id)}">
                            未確認へ再送
                          </button>` : ""}
                        ${row.status === "scheduled" ? `
                          <button class="btn btn-secondary btn-small" type="button" data-cancel-broadcast="${escapeHtml(row.id)}">
                            予約を取消
                          </button>` : ""}
                      </div>
                    </article>
                  `).join("");
          ''',
          '''        els.broadcastHistory.innerHTML = rows.map((row) => {
                    const demoRecord = String(row.broadcast_type || "").startsWith("demo_");
                    const resultLabel = demoRecord ? "疑似送信" : "送信成功";

                    return `
                      <article class="broadcast-history-item">
                        <div class="broadcast-history-head">
                          <h4>${demoRecord ? "【デモ】" : ""}${escapeHtml(row.subject || "件名なし")}</h4>
                          <span class="status-pill status-${row.status === "sent" ? "ok" : row.status === "failed" ? "error" : "neutral"}">
                            ${escapeHtml(broadcastStatusLabel(row.status))}
                          </span>
                        </div>
                        <p>${escapeHtml((row.message_body || "").slice(0, 140))}</p>
                        <div class="broadcast-history-meta">
                          対象 ${row.target_family_count || 0} / ${resultLabel} ${row.success_count || 0}
                          / 未連携 ${row.unlinked_count || 0} / 確認済 ${row.acknowledged_count || 0}
                          ${demoRecord ? "<br>※公開デモのため実際のLINE送信は行っていません。" : ""}
                          <br>${escapeHtml(formatDateTime(row.sent_at || row.scheduled_at || row.created_at))}
                        </div>
                        <div class="toolbar" style="margin-top:8px">
                          ${["sent","partial"].includes(row.status) ? `
                            <button class="btn btn-secondary btn-small" type="button" data-resend-broadcast="${escapeHtml(row.id)}">
                              未確認へ再送
                            </button>` : ""}
                          ${row.status === "scheduled" ? `
                            <button class="btn btn-secondary btn-small" type="button" data-cancel-broadcast="${escapeHtml(row.id)}">
                              予約を取消
                            </button>` : ""}
                        </div>
                      </article>
                    `;
                  }).join("");
          ''',
              "owner demo history labels",
          )

          Path("worker.js").write_text(worker, encoding="utf-8")
          Path("owner.html").write_text(owner, encoding="utf-8")
          Path("config.js").write_text(config, encoding="utf-8")

          checks = [
              ("worker version", "DAYCARE-3-R7-EMERGENCY-BROADCAST-DEMO-SAFE-20260925" in worker),
              ("demo helper", "isDemoBroadcastFacility" in worker),
              ("demo dispatcher", "dispatchDemoBroadcastRow" in worker),
              ("demo test", "broadcast_demo_test_send" in worker),
              ("demo send", "demo_simulated" in worker),
              ("demo schedule", "demo_scheduled" in worker),
              ("owner version", "DAYCARE-8-R5-EMERGENCY-BROADCAST-DEMO-SAFE-20260925" in owner),
              ("owner demo helper", "isPublicDemoBroadcast" in owner),
              ("demo preview", "公開デモ：実際のLINEには送信されません。" in owner),
              ("demo history", "※公開デモのため実際のLINE送信は行っていません。" in owner),
              ("config worker", "DAYCARE-3-R7-EMERGENCY-BROADCAST-DEMO-SAFE-20260925" in config),
          ]
          failed = [name for name, ok in checks if not ok]
          if failed:
              raise SystemExit("STATIC QA FAILED: " + ", ".join(failed))

          print("DEMO SAFE SEND R6 STATIC QA PASS")

          PY

      - name: Syntax and static QA
        shell: bash
        run: |
          cp worker.js /tmp/worker.mjs
          node --check /tmp/worker.mjs
          node --check config.js
          grep -q 'dispatchDemoBroadcastRow' worker.js
          grep -q 'demo_simulated' worker.js
          grep -q 'demo_scheduled' worker.js
          grep -q 'isPublicDemoBroadcast' owner.html
          grep -q '公開デモ：実際のLINEには送信されません。' owner.html
          echo "DEMO SAFE SEND R6 QA PASS"

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch ".github/workflows/dpro-daycare-emergency-broadcast-demo-safe-send-r6.yml"
          git add worker.js owner.html config.js
          git commit -m "Add DAYCARE demo-safe broadcast simulation"
