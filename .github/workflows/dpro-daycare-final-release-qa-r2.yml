name: DPRO DAYCARE Final Release QA R2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOCK_SHA: b82d1d1b5ef301d06e015888f6be58ba94cf0b23
      FRONT_BASE: https://dpromstk2000-lab.github.io/dpro-dayservice-line
      API_BASE: https://dpro-dayservice-line-api.dpromstk2000.workers.dev

    steps:
      - name: Checkout current lock candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.LOCK_SHA }}
          fetch-depth: 1

      - name: Static final audit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$LOCK_SHA"

          cp worker.js /tmp/daycare-worker.mjs
          node --check /tmp/daycare-worker.mjs
          node --check config.js
          node --check tutorial-daycare.js

          grep -q 'DAYCARE-3-R16-SHARED-SCHEDULER-20260930' worker.js
          grep -q 'shared_scheduler_bridge: true' worker.js
          grep -q '/api/internal/scheduler/auto-escalation' worker.js

          grep -q 'DPRO DAYCARE FINAL DEMO POLISH R1 20260930' owner.html
          grep -q 'DPRO DAYCARE BROADCAST HISTORY UX R1 20260930' owner.html
          grep -q 'broadcastHistoryExpanded: false' owner.html
          grep -q 'broadcastHistoryFocusedId: null' owner.html
          grep -q '過去の履歴を表示' owner.html
          grep -q 'data-broadcast-history-focus' owner.html

          for nav in dashboard today requests search schedule messages broadcasts; do
            grep -q "data-nav=\"$nav\"" owner.html
          done

          for f in index.html member.html owner-ipad.html system-check.html demo-guide.html guide-center.html broadcast-ack.html line-idtoken-helper.js; do
            test -f "$f"
          done

          echo "STATIC_FINAL_AUDIT=PASS"

      - name: Live runtime audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-release-evidence
          python3 <<'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path

          API=os.environ["API_BASE"].rstrip("/")
          FRONT=os.environ["FRONT_BASE"].rstrip("/")

          def get(url, accept="*/*"):
              req=urllib.request.Request(
                  url,
                  headers={"Accept":accept,"User-Agent":"DPRO-DAYCARE-FINAL-RELEASE-QA-R2"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, dict(r.headers), r.read()
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), e.read()

          out={"ok":True,"checks":{}}
          status, headers, body = get(API+"/api/health","application/json")
          health=json.loads(body.decode("utf-8"))
          out["health"]=health
          out["checks"]["health_200"]=status==200 and health.get("ok") is True
          out["checks"]["worker_r16"]=health.get("workerVersion")=="DAYCARE-3-R16-SHARED-SCHEDULER-20260930"
          out["checks"]["database_r3"]=health.get("databaseVersion")=="DAYCARE-DB-R3-20260925-EMERGENCY-BROADCAST-01"
          out["checks"]["versions_aligned"]=health.get("versionsAligned") is True
          out["checks"]["shared_scheduler_feature"]=(health.get("features") or {}).get("shared_scheduler_bridge") is True

          urls={
              "owner_demo": FRONT+"/owner.html?demo=1",
              "family": FRONT+"/index.html?demo=1",
              "member": FRONT+"/member.html?demo=1",
              "ipad": FRONT+"/owner-ipad.html?demo=1",
              "system_check": FRONT+"/system-check.html",
              "demo_guide": FRONT+"/demo-guide.html",
              "guide_center": FRONT+"/guide-center.html",
          }
          out["public"]={}
          for key,url in urls.items():
              s,h,b=get(url,"text/html,*/*")
              out["public"][key]={"status":s,"bytes":len(b)}
              out["checks"][f"{key}_200"]=s==200 and len(b)>500

          out["ok"]=all(out["checks"].values())
          Path("final-release-evidence/runtime.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          if not out["ok"]:
              raise SystemExit(1)
          PY

      - name: Browser UX audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dpro-browser final-release-evidence/screens
          cd /tmp/dpro-browser
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

          cat > qa.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const FRONT=process.env.FRONT_BASE;
          const OUT=process.env.GITHUB_WORKSPACE + '/final-release-evidence';
          const results=[];

          async function basicPage(browser,key,path,viewport){
            const page=await browser.newPage({viewport});
            const jsErrors=[];
            page.on('pageerror',e=>jsErrors.push(String(e)));
            let status=null,loadError=null;
            try{
              const r=await page.goto(FRONT+path,{waitUntil:'networkidle',timeout:45000});
              status=r?.status()??null;
            }catch(e){loadError=String(e)}
            const m=await page.evaluate(()=>({
              innerWidth:window.innerWidth,
              scrollWidth:Math.max(document.documentElement.scrollWidth,document.body?.scrollWidth||0),
            })).catch(()=>({}));
            const overflow=(m.scrollWidth||0)>(m.innerWidth||0)+3;
            const ok=status===200&&!loadError&&!overflow&&jsErrors.length===0;
            if(ok) await page.screenshot({path:`${OUT}/screens/${key}.png`,fullPage:true}).catch(()=>{});
            results.push({key,path,status,loadError,overflow,jsErrors,ok});
            await page.close();
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});

            const owner=await browser.newPage({viewport:{width:1440,height:1000}});
            const ownerErrors=[];
            owner.on('pageerror',e=>ownerErrors.push(String(e)));
            let ownerStatus=null,ownerLoadError=null;

            try{
              const r=await owner.goto(FRONT+'/owner.html?demo=1',{waitUntil:'domcontentloaded',timeout:45000});
              ownerStatus=r?.status()??null;
              await owner.locator('#app.is-visible').waitFor({state:'visible',timeout:30000});
              await owner.waitForTimeout(800);
            }catch(e){
              ownerLoadError=String(e);
            }

            const navNames=['dashboard','today','requests','search','schedule','messages','broadcasts'];
            const navChecks={};

            if(!ownerLoadError){
              for(const name of navNames){
                try{
                  await owner.locator(`[data-nav="${name}"]`).click({timeout:8000});
                  await owner.locator(`#section-${name}.is-active`).waitFor({state:'visible',timeout:8000});
                  navChecks[name]=true;
                  await owner.waitForTimeout(250);
                }catch(e){
                  navChecks[name]=false;
                }
              }

              try{
                await owner.locator('[data-nav="broadcasts"]').click({timeout:8000});
                await owner.locator('#section-broadcasts.is-active').waitFor({state:'visible',timeout:8000});
                await owner.locator('#broadcastHistory .broadcast-history-item').first().waitFor({state:'visible',timeout:15000});
                await owner.waitForTimeout(500);
              }catch(e){}
            }

            const ownerMetrics=await owner.evaluate(()=>({
              innerWidth:window.innerWidth,
              scrollWidth:Math.max(document.documentElement.scrollWidth,document.body?.scrollWidth||0),
              appVisible:document.querySelector('#app')?.classList.contains('is-visible')||false,
              activeSection:document.querySelector('.page-section.is-active')?.dataset.section||null,
              historyItems:document.querySelectorAll('#broadcastHistory .broadcast-history-item').length,
              historyLatest3Text:(document.querySelector('#broadcastHistory')?.innerText||'').includes('最新3件を表示'),
              hasExpand:(document.querySelector('#broadcastHistory')?.innerText||'').includes('拡大'),
              autoEscalationOff:(document.querySelector('#autoEscalationStatus')?.innerText||'').includes('OFF'),
            })).catch(()=>({}));

            const ownerOverflow=(ownerMetrics.scrollWidth||0)>(ownerMetrics.innerWidth||0)+3;
            const ownerOk=
              ownerStatus===200 &&
              !ownerLoadError &&
              !ownerOverflow &&
              ownerErrors.length===0 &&
              ownerMetrics.appVisible===true &&
              Object.values(navChecks).every(Boolean) &&
              ownerMetrics.activeSection==='broadcasts' &&
              ownerMetrics.historyItems>=1 &&
              ownerMetrics.historyLatest3Text===true &&
              ownerMetrics.hasExpand===true &&
              ownerMetrics.autoEscalationOff===true;

            if(ownerOk){
              await owner.screenshot({path:`${OUT}/screens/owner-desktop.png`,fullPage:true}).catch(()=>{});
            }

            results.push({
              key:'owner-desktop',
              status:ownerStatus,
              loadError:ownerLoadError,
              overflow:ownerOverflow,
              jsErrors:ownerErrors,
              navChecks,
              ownerMetrics,
              ok:ownerOk
            });
            await owner.close();

            await basicPage(browser,'family-mobile390','/index.html?demo=1',{width:390,height:844});
            await basicPage(browser,'family-mobile320','/index.html?demo=1',{width:320,height:720});
            await basicPage(browser,'member-mobile390','/member.html?demo=1',{width:390,height:844});
            await basicPage(browser,'ipad','/owner-ipad.html?demo=1',{width:1024,height:768});
            await basicPage(browser,'system-check','/system-check.html',{width:390,height:844});

            await browser.close();

            const out={ok:results.every(x=>x.ok),results};
            fs.writeFileSync(`${OUT}/browser.json`,JSON.stringify(out,null,2)+'\n');
            console.log(JSON.stringify(out,null,2));
            if(!out.ok) process.exitCode=1;
          })();
          JS

          node qa.js

      - name: Final QA summary
        if: always()
        shell: bash
        run: |
          {
            echo "## DPRO DAYCARE Final Release QA R2"
            echo ""
            echo "- R1 false-negative cause: browser QA started before demo auto-login completed"
            echo "- R2 waits for #app.is-visible before navigation checks"
            echo "- Static source audit: completed"
            echo "- Worker/API live audit: completed"
            echo "- Public URL audit: completed"
            echo "- Owner 7 navigation sections: checked after login"
            echo "- Broadcast history latest 3 / expand / auto escalation OFF: checked"
            echo "- Family mobile 390/320: checked"
            echo "- Member mobile: checked"
            echo "- iPad: checked"
            echo "- System check: checked"
            echo ""
            echo "If this workflow is green, automated FINAL RELEASE QA = PASS."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload FINAL QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dpro-daycare-final-release-qa-r2
          path: final-release-evidence
          if-no-files-found: error
