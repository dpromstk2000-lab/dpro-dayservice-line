name: DPRO DAYCARE R8 Deploy Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCRIPT_NAME: dpro-dayservice-line-api
      API_BASE: https://dpro-dayservice-line-api.dpromstk2000.workers.dev
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Validate R8 source and token
        shell: bash
        run: |
          set -euo pipefail
          test -s worker.js
          test -s line-idtoken-helper.js
          test -n "${CF_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN is missing'; exit 2; }
          node --check worker.js
          node --check line-idtoken-helper.js
          mkdir -p product-ready-evidence/r8-deploy
          sha256sum worker.js line-idtoken-helper.js | tee product-ready-evidence/r8-deploy/source.sha256
          grep -q 'DAYCARE-3-R8-FAMILY-CONTACT-ROUTING-20260930' worker.js
          grep -q 'function relationAllowsBroadcast' worker.js
          grep -q 'receive_normal' worker.js
          grep -q 'receive_emergency' worker.js
          grep -q 'https://api.line.me/oauth2/v2.1/verify' worker.js
          ! grep -q 'https://api.line.me/v2/profile' worker.js
          echo "SOURCE_QA=PASS"

      - name: Find account containing target Worker
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CF_TOKEN" \
            https://api.cloudflare.com/client/v4/accounts > /tmp/accounts.json
          python3 - <<'PY' > /tmp/account-ids
          import json
          d=json.load(open('/tmp/accounts.json'))
          for row in d.get('result') or []:
              if row.get('id'): print(row['id'])
          PY
          found=''
          while IFS= read -r aid; do
            [ -n "$aid" ] || continue
            echo "::add-mask::$aid"
            code=$(curl -sS -o /tmp/current-worker -w '%{http_code}' \
              -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$aid/workers/scripts/$SCRIPT_NAME/content/v2")
            if [ "$code" = "200" ]; then
              found="$aid"
              break
            fi
          done < /tmp/account-ids
          [ -n "$found" ] || { echo 'Target Worker not found in accessible accounts'; exit 3; }
          printf '%s' "$found" > /tmp/dpro-account-id

      - name: Deploy R8 Worker content only
        shell: bash
        run: |
          set -euo pipefail
          aid=$(cat /tmp/dpro-account-id)
          code=$(curl -sS \
            -o product-ready-evidence/r8-deploy/cloudflare-deploy-response.json \
            -w '%{http_code}' \
            -X PUT \
            -H "Authorization: Bearer $CF_TOKEN" \
            -F 'metadata={"main_module":"worker.js"};type=application/json' \
            -F 'worker.js=@worker.js;type=application/javascript+module' \
            "https://api.cloudflare.com/client/v4/accounts/$aid/workers/scripts/$SCRIPT_NAME/content")
          echo "HTTP $code"
          [ "$code" = "200" ] || {
            cat product-ready-evidence/r8-deploy/cloudflare-deploy-response.json
            exit 4
          }
          python3 - <<'PY'
          import json
          p='product-ready-evidence/r8-deploy/cloudflare-deploy-response.json'
          d=json.load(open(p))
          print({'success':d.get('success'),'errors':d.get('errors'),'messages':d.get('messages')})
          if d.get('success') is not True:
              raise SystemExit(5)
          PY

      - name: R8 live smoke check
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json,time,urllib.request,urllib.error
          from pathlib import Path

          api='https://dpro-dayservice-line-api.dpromstk2000.workers.dev'
          allowed='https://dpromstk2000-lab.github.io'

          def req(path, method='GET', headers=None, body=None):
              h={'Accept':'application/json','User-Agent':'DPRO-DAYCARE-R8-DEPLOY'}
              h.update(headers or {})
              data=None if body is None else json.dumps(body).encode()
              if data is not None:
                  h['Content-Type']='application/json'
              r=urllib.request.Request(api+path,method=method,headers=h,data=data)
              try:
                  with urllib.request.urlopen(r,timeout=25) as x:
                      return x.status,dict(x.headers),x.read()
              except urllib.error.HTTPError as e:
                  return e.code,dict(e.headers),e.read()

          health=None
          for _ in range(15):
              s,h,b=req('/api/health')
              try:
                  d=json.loads(b.decode())
              except Exception:
                  d={}
              if s==200 and d.get('workerVersion')=='DAYCARE-3-R8-FAMILY-CONTACT-ROUTING-20260930':
                  health=d
                  break
              time.sleep(2)

          if not health:
              raise SystemExit('R8 Worker version did not become live')

          expected={
              'databaseVersion':'DAYCARE-DB-R3-20260925-EMERGENCY-BROADCAST-01',
              'adapterVersion':'DPRO-CONTROL-ADAPTER-1.0',
              'versionsAligned':True,
          }
          for k,v in expected.items():
              if health.get(k)!=v:
                  raise SystemExit(f'contract mismatch {k}: {health.get(k)!r}')

          s,h,b=req('/api/health','OPTIONS',{
              'Origin':allowed,
              'Access-Control-Request-Method':'GET'
          })
          ao=h.get('Access-Control-Allow-Origin') or h.get('access-control-allow-origin')
          if ao!=allowed:
              raise SystemExit(f'allowed CORS mismatch: {ao!r}')

          s,h,b=req('/api/health','OPTIONS',{
              'Origin':'https://evil.example',
              'Access-Control-Request-Method':'GET'
          })
          evil=h.get('Access-Control-Allow-Origin') or h.get('access-control-allow-origin')
          if evil in ('*','https://evil.example'):
              raise SystemExit(f'unsafe CORS: {evil!r}')

          out={
              'ok':True,
              'health':health,
              'cors':{'allowed':ao,'evil':evil}
          }
          Path('product-ready-evidence/r8-deploy/live-smoke.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+'\n',
              encoding='utf-8'
          )
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Upload R8 deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dpro-daycare-r8-deploy-evidence
          path: product-ready-evidence/r8-deploy
          if-no-files-found: error
