name: DPRO DAYCARE Nav Ledger Polish R6

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brushup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply nav and ledger polish
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          python -c 'import os,base64; exec(base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8"))'

      - name: Validate owner source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'DPRO DAYCARE LEDGER USABILITY BRUSHUP R5' owner.html
          grep -q 'DPRO DAYCARE NAV / LEDGER POLISH R6' owner.html
          grep -q '利用者・ご家族を探す' owner.html
          grep -q '>未検索<' owner.html
          echo "STATIC_QA=PASS"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- owner.html; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add owner.html
          git commit -m "DAYCARE nav and ledger polish R6"
          git push origin HEAD:main

      - name: Summary
        shell: bash
        run: |
          echo "## DPRO DAYCARE Nav Ledger Polish R6" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sidebar full-height navigation: reinforced" >> "$GITHUB_STEP_SUMMARY"
          echo "- All desktop menu items remain visible/scrollable" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ledger initial count: 0件 -> 未検索" >> "$GITHUB_STEP_SUMMARY"
          echo "- Search UI readability: improved" >> "$GITHUB_STEP_SUMMARY"
          echo "- Duplicate page-heading feeling: reduced" >> "$GITHUB_STEP_SUMMARY"
          echo "- Existing APIs / LINE / broadcast behavior: unchanged" >> "$GITHUB_STEP_SUMMARY"
