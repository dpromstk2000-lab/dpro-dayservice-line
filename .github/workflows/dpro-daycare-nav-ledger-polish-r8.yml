name: DPRO DAYCARE Nav Ledger Polish R8

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brushup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply nav and ledger polish
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          python -c 'import os,base64; exec(base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8"))'

      - name: Validate owner source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'DPRO DAYCARE LEDGER USABILITY BRUSHUP R5' owner.html
          grep -q 'DPRO DAYCARE NAV / LEDGER POLISH R8' owner.html
          grep -q '利用者・ご家族を探す' owner.html
          grep -q '>未検索<' owner.html
          echo "STATIC_QA=PASS"

      - name: Update owner.html through GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/contents/owner.html?ref=main"             > /tmp/current.json

          python - <<'PY'
          import json, base64
          from pathlib import Path

          current=json.load(open("/tmp/current.json", encoding="utf-8"))
          sha=current["sha"]
          content=base64.b64encode(Path("owner.html").read_bytes()).decode("ascii")

          payload={
              "message":"DAYCARE nav and ledger polish R8",
              "content":content,
              "sha":sha,
              "branch":"main",
          }
          Path("/tmp/payload.json").write_text(
              json.dumps(payload, ensure_ascii=False),
              encoding="utf-8"
          )
          print("PAYLOAD_BUILD=PASS")
          PY

          curl -fsSL             -X PUT             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "Content-Type: application/json"             "https://api.github.com/repos/$REPO/contents/owner.html"             --data-binary @/tmp/payload.json             > /tmp/update.json

          python - <<'PY'
          import json
          d=json.load(open("/tmp/update.json", encoding="utf-8"))
          commit=(d.get("commit") or {}).get("sha")
          content=(d.get("content") or {}).get("sha")
          if not commit or not content:
              raise SystemExit("ERROR: GitHub API update response missing commit/content sha")
          print("API_UPDATE=PASS")
          print("commit_sha="+commit)
          print("content_sha="+content)
          PY

      - name: Summary
        shell: bash
        run: |
          echo "## DPRO DAYCARE Nav Ledger Polish R8" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sidebar full-height navigation: reinforced" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ledger initial count: 0件 -> 未検索" >> "$GITHUB_STEP_SUMMARY"
          echo "- Search UI readability: improved" >> "$GITHUB_STEP_SUMMARY"
          echo "- Duplicate page-heading feeling: reduced" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub API payload built from file, not command arguments" >> "$GITHUB_STEP_SUMMARY"
          echo "- Existing APIs / LINE / broadcast behavior: unchanged" >> "$GITHUB_STEP_SUMMARY"
