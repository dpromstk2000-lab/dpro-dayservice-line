name: DPRO DAYCARE Family Contact Routing Edit R1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCRIPT_NAME: dpro-dayservice-line-api
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch worker config owner
        shell: bash
        env:
          WORKER_PATCH_B64: ""
          CONFIG_PATCH_B64: ""
          OWNER_PATCH_B64: ""
        run: |
          set -euo pipefail
          python -c 'import os,base64; exec(base64.b64decode(os.environ["WORKER_PATCH_B64"]).decode("utf-8"))'
          python -c 'import os,base64; exec(base64.b64decode(os.environ["CONFIG_PATCH_B64"]).decode("utf-8"))'
          python -c 'import os,base64; exec(base64.b64decode(os.environ["OWNER_PATCH_B64"]).decode("utf-8"))'
          node --check worker.js
          node --check config.js
          grep -q 'DAYCARE-3-R12-FAMILY-CONTACT-EDIT-20260930' worker.js
          grep -q 'adminFamilyContactRoutingUpdate' config.js
          grep -q 'DPRO DAYCARE FAMILY CONTACT ROUTING EDIT R1' owner.html
          echo "STATIC_QA=PASS"

      - name: Update repository files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for FILE in worker.js config.js owner.html; do
            curl -fsSL               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$REPO/contents/$FILE?ref=main" > "/tmp/current-$FILE.json"

            FILE="$FILE" python - <<'PY' > "/tmp/payload-$FILE.json"
          import os,json,base64
          from pathlib import Path
          f=os.environ["FILE"]
          current=json.load(open("/tmp/current-"+f+".json",encoding="utf-8"))
          print(json.dumps({
            "message":"DAYCARE family contact routing edit R1: "+f,
            "content":base64.b64encode(Path(f).read_bytes()).decode("ascii"),
            "sha":current["sha"],
            "branch":"main"
          },ensure_ascii=False))
          PY

            curl -fsSL -X PUT               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "Content-Type: application/json"               "https://api.github.com/repos/$REPO/contents/$FILE"               --data-binary @"/tmp/payload-$FILE.json" > "/tmp/update-$FILE.json"

            FILE="$FILE" python - <<'PY'
          import os,json
          f=os.environ["FILE"]
          d=json.load(open("/tmp/update-"+f+".json",encoding="utf-8"))
          if not (d.get("commit") or {}).get("sha"):
              raise SystemExit("GitHub update failed: "+f)
          print("UPDATED",f)
          PY
          done

      - name: Find Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN is missing'; exit 2; }
          curl -fsS -H "Authorization: Bearer $CF_TOKEN"             https://api.cloudflare.com/client/v4/accounts > /tmp/accounts.json
          python3 - <<'PY' > /tmp/account-ids
          import json
          d=json.load(open('/tmp/accounts.json'))
          for row in d.get('result') or []:
              if row.get('id'): print(row['id'])
          PY
          found=''
          while IFS= read -r aid; do
            [ -n "$aid" ] || continue
            echo "::add-mask::$aid"
            code=$(curl -sS -o /tmp/current-worker -w '%{http_code}'               -H "Authorization: Bearer $CF_TOKEN"               "https://api.cloudflare.com/client/v4/accounts/$aid/workers/scripts/$SCRIPT_NAME/content/v2")
            if [ "$code" = "200" ]; then found="$aid"; break; fi
          done < /tmp/account-ids
          [ -n "$found" ] || { echo 'Target Worker not found'; exit 3; }
          printf '%s' "$found" > /tmp/dpro-account-id

      - name: Deploy R12 Worker
        shell: bash
        run: |
          set -euo pipefail
          aid=$(cat /tmp/dpro-account-id)
          code=$(curl -sS -o /tmp/deploy.json -w '%{http_code}'             -X PUT             -H "Authorization: Bearer $CF_TOKEN"             -F 'metadata={"main_module":"worker.js"};type=application/json'             -F 'worker.js=@worker.js;type=application/javascript+module'             "https://api.cloudflare.com/client/v4/accounts/$aid/workers/scripts/$SCRIPT_NAME/content")
          echo "HTTP $code"
          [ "$code" = "200" ] || { cat /tmp/deploy.json; exit 4; }

      - name: Poll live health
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time,urllib.request
          url='https://dpro-dayservice-line-api.dpromstk2000.workers.dev/api/health'
          expected='DAYCARE-3-R12-FAMILY-CONTACT-EDIT-20260930'
          last={}
          for _ in range(20):
              req=urllib.request.Request(url,headers={
                'Accept':'application/json',
                'User-Agent':'DPRO-DAYCARE-R12-VERIFY'
              })
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      last=json.loads(r.read().decode())
                  if last.get('workerVersion')==expected:
                      print("LIVE_HEALTH=PASS")
                      break
              except Exception as e:
                  print("retry",repr(e))
              time.sleep(2)
          else:
              raise SystemExit("R12 did not become live: "+repr(last.get('workerVersion')))
          PY

      - name: Verify demo routing update API safely
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS             -H 'Accept: application/json'             -H 'User-Agent: DPRO-DAYCARE-R12-VERIFY'             -H 'X-Admin-Code: 1234'             'https://dpro-dayservice-line-api.dpromstk2000.workers.dev/api/admin/user-detail?facility_code=dpro_dayservice_demo&user_number=DAY-DEMO-001'             > /tmp/detail.json

          python3 - <<'PY' > /tmp/payload.json
          import json
          d=json.load(open('/tmp/detail.json'))
          f=(d.get('families') or [None])[0]
          if not f or not (f.get('relation') or {}).get('id'):
              raise SystemExit('demo relation not found')
          r=f['relation']
          print(json.dumps({
            'facility_code':'dpro_dayservice_demo',
            'relation_id':r['id'],
            'receive_normal':bool(r.get('receive_normal')),
            'receive_emergency':bool(r.get('receive_emergency')),
            'allow_escalation':bool(r.get('allow_escalation')),
            'contact_priority':int(r.get('contact_priority') or 1),
            'operator_name':'R12自動検査',
            'device_type':'pc'
          },ensure_ascii=False))
          PY

          curl -fsS             -X POST             -H 'Accept: application/json'             -H 'Content-Type: application/json'             -H 'User-Agent: DPRO-DAYCARE-R12-VERIFY'             -H 'X-Admin-Code: 1234'             --data-binary @/tmp/payload.json             'https://dpro-dayservice-line-api.dpromstk2000.workers.dev/api/admin/family-contact-routing/update?facility_code=dpro_dayservice_demo'             > /tmp/update-result.json

          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/update-result.json'))
          if d.get('ok') is not True:
              raise SystemExit('routing update api not ok')
          print("ROUTING_UPDATE_QA=PASS")
          PY
