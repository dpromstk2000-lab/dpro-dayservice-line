name: DPRO DAYCARE Ledger Usability Brushup R3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brushup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Brush up owner ledger UX
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("owner.html")
          s = p.read_text(encoding="utf-8")

          # 1. Rename search area as an operator-friendly ledger.
          s = s.replace("利用者・家族検索", "利用者・家族台帳")
          s = s.replace(
              "氏名・電話番号・利用者番号から検索します。",
              "利用者・ご家族の登録情報、連絡先、利用状況を確認します。"
          )
          s = s.replace(
              "利用者名、家族名、電話番号、利用者番号から検索できます。",
              "利用者・ご家族の登録情報をまとめて確認できます。氏名・電話番号・利用者番号で絞り込めます。"
          )
          s = s.replace(
              "<h3>検索結果</h3>\n                  <p>利用者と家族をまとめて表示します。</p>",
              "<h3>台帳一覧</h3>\n                  <p>検索すると、利用者とご家族をまとめて表示します。</p>"
          )
          s = s.replace(
              "左の検索結果から利用者を選択してください。",
              "左の台帳一覧から利用者を選択すると、登録情報・ご家族・利用予定・連絡履歴を確認できます。"
          )

          # 2. Add a simple orientation panel before the search bar.
          anchor = '''          <div class="toolbar">
            <input
              class="input search-input"
              id="searchInput"
          '''
          insert = '''          <div class="ledger-guide" aria-label="利用者・家族台帳の使い方">
            <div class="ledger-guide-icon" aria-hidden="true">👤</div>
            <div>
              <strong>利用者・ご家族の情報をここでまとめて確認できます</strong>
              <p>
                利用者を選ぶと、ご家族の続柄・電話番号・LINE連携状況、
                利用予定、家族からの連絡履歴まで確認できます。
              </p>
            </div>
          </div>

          <div class="toolbar">
            <input
              class="input search-input"
              id="searchInput"
          '''
          if "class=\"ledger-guide\"" not in s:
              if anchor not in s:
                  raise SystemExit("ERROR: ledger toolbar anchor not found")
              s = s.replace(anchor, insert, 1)

          # 3. Make family details a real ledger block.
          start = s.find("      function renderUserDetail(data) {")
          end = s.find("      function selectUserForSchedule(", start)
          if start < 0 or end < 0:
              raise SystemExit("ERROR: renderUserDetail block not found")

          new_render = r'''      function renderUserDetail(data) {
        const user = data.user;
        const families = data.families || [];
        const schedules = data.schedules || [];
        const requests = data.family_requests || [];
        const demoMode = new URLSearchParams(window.location.search).get("demo") === "1";

        const familyCards = families.length
          ? families.map((family) => {
              const relationship =
                family.relation?.relationship_to_user ||
                family.relationship ||
                "続柄未登録";
              const primary =
                family.relation?.is_primary_contact || family.is_primary;
              const linked = family.line_linked;
              const lineLabel = linked === true
                ? "LINE連携済み"
                : linked === false
                  ? "LINE未連携"
                  : demoMode
                    ? "LINE未連携（公開デモ）"
                    : "LINE連携状況は本番接続時に表示";
              const lineMode = linked === true ? "ok" : linked === false ? "warning" : "neutral";

              return `
                <div class="ledger-family-card">
                  <div class="ledger-family-main">
                    <div class="ledger-family-title">
                      <strong>${escapeHtml(family.full_name || "家族")}</strong>
                      ${primary ? '<span class="ledger-primary">主連絡先</span>' : ""}
                    </div>
                    <div class="ledger-family-meta">
                      <span>${escapeHtml(relationship)}</span>
                      <span>${escapeHtml(CONFIG.utils.formatPhone(family.phone) || "電話未登録")}</span>
                    </div>
                  </div>
                  <span class="status-pill status-${lineMode}">${escapeHtml(lineLabel)}</span>
                </div>
              `;
            }).join("")
          : '<div class="empty">ご家族情報はまだ登録されていません。</div>';

        els.userDetailPanel.innerHTML = `
          <div class="ledger-detail-head">
            <div>
              <span class="ledger-detail-label">利用者</span>
              <h3>${escapeHtml(user.full_name)}</h3>
              <div class="item-sub">利用者番号：${escapeHtml(user.user_number)}</div>
            </div>
          </div>

          <div class="detail-grid">
            <div class="detail-item">
              <span class="detail-label">通常送迎</span>
              <strong class="detail-value">${escapeHtml(
                CONFIG.utils.transportModeLabel(user.standard_transport_mode)
              )}</strong>
            </div>
            <div class="detail-item">
              <span class="detail-label">持ち物</span>
              <strong class="detail-value">${escapeHtml(
                normalizeText(user.item_note) || "未登録"
              )}</strong>
            </div>
          </div>

          <div class="detail-section">
            <div class="ledger-section-title">
              <h4>ご家族・LINE連携</h4>
              <span>${families.length}名</span>
            </div>
            <div class="ledger-family-list">${familyCards}</div>
            <p class="ledger-note">
              LINE連携状況は、緊急・一斉連絡の送信対象判定にも使用します。
            </p>
          </div>

          <div class="detail-section">
            <div class="ledger-section-title">
              <h4>直近の利用予定</h4>
              <span>最大5件</span>
            </div>
            <div class="ledger-timeline">
              ${schedules.slice(0, 5).map((schedule) => `
                <div class="ledger-timeline-row">
                  <strong>${escapeHtml(formatDate(schedule.service_date))}</strong>
                  <span>${escapeHtml(CONFIG.utils.statusLabel(schedule.status))}</span>
                </div>
              `).join("") || '<div class="empty">利用予定はありません。</div>'}
            </div>
          </div>

          <div class="detail-section">
            <div class="ledger-section-title">
              <h4>家族からの連絡</h4>
              <span>最大5件</span>
            </div>
            <div class="ledger-timeline">
              ${requests.slice(0, 5).map((request) => `
                <div class="ledger-timeline-row">
                  <strong>${escapeHtml(
                    cleanDemoLabel(request.subject) ||
                    CONFIG.utils.requestTypeLabel(request.request_type)
                  )}</strong>
                  <span>${escapeHtml(
                    CONFIG.utils.requestStatusLabel(request.request_status)
                  )}</span>
                </div>
              `).join("") || '<div class="empty">家族からの連絡はありません。</div>'}
            </div>
          </div>

          <div class="ledger-actions">
            <button
              class="btn btn-primary"
              type="button"
              data-use-user-schedule="${escapeHtml(user.id)}"
              data-user-name="${escapeHtml(user.full_name)}"
            >
              利用予定を登録
            </button>
            <button
              class="btn btn-blue"
              type="button"
              data-use-user-message="${escapeHtml(user.id)}"
              data-user-name="${escapeHtml(user.full_name)}"
            >
              家族への連絡文面を作る
            </button>
          </div>
        `;
      }

'''
          s = s[:start] + new_render + s[end:]

          # 4. Better empty-state guidance before the first search.
          init_anchor = '''        attachEvents();

        if (demoPreview || CONFIG.storage.getAdminCode()) {
'''
          init_insert = '''        attachEvents();

        if (els.searchResults && !els.searchResults.innerHTML.trim()) {
          els.searchResults.innerHTML = `
            <div class="ledger-empty-guide">
              <strong>利用者・ご家族を検索してください</strong>
              <span>氏名、電話番号、利用者番号の一部でも検索できます。</span>
            </div>
          `;
        }

        if (demoPreview || CONFIG.storage.getAdminCode()) {
'''
          if "class=\"ledger-empty-guide\"" not in s:
              if init_anchor not in s:
                  raise SystemExit("ERROR: initialize anchor not found")
              s = s.replace(init_anchor, init_insert, 1)

          # 5. CSS: banner clipping + ledger hierarchy + touch/readability.
          marker = "DPRO DAYCARE LEDGER USABILITY BRUSHUP R3"
          css = r'''
/* ============================================================
   DPRO DAYCARE LEDGER USABILITY BRUSHUP R3
   2026-09-30
   ============================================================ */
@media(min-width:761px){
  body.dayservice-operation-demo-page:has(.app.is-visible) .dayservice-operation-demo-banner{
    width:calc(100% - var(--sidebar-width) - 36px);
    margin:14px 18px 0 calc(var(--sidebar-width) + 18px);
  }
}

.ledger-guide{
  display:flex;
  align-items:flex-start;
  gap:14px;
  margin-bottom:14px;
  padding:16px 18px;
  border:1px solid #bdd7c6;
  border-radius:15px;
  background:#f4fbf6;
}
.ledger-guide-icon{
  display:grid;
  place-items:center;
  width:42px;
  height:42px;
  flex:0 0 42px;
  border-radius:12px;
  background:#e4f4e9;
  font-size:21px;
}
.ledger-guide strong{
  display:block;
  font-size:15px;
  line-height:1.5;
}
.ledger-guide p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.65;
}

.ledger-empty-guide{
  display:grid;
  gap:6px;
  place-items:center;
  min-height:180px;
  padding:24px;
  border:1px dashed var(--line-strong);
  border-radius:13px;
  background:var(--surface-soft);
  text-align:center;
}
.ledger-empty-guide strong{font-size:16px}
.ledger-empty-guide span{color:var(--muted);font-size:13px}

.ledger-detail-head{
  display:flex;
  justify-content:space-between;
  gap:14px;
  align-items:flex-start;
  margin-bottom:14px;
}
.ledger-detail-label{
  display:inline-block;
  margin-bottom:4px;
  color:var(--brand);
  font-size:12px;
  font-weight:900;
}
.ledger-detail-head h3{
  margin:0;
  font-size:23px;
  line-height:1.35;
}

.ledger-section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:9px;
}
.ledger-section-title h4{
  margin:0;
  font-size:16px;
}
.ledger-section-title>span{
  color:var(--muted);
  font-size:12px;
}

.ledger-family-list{
  display:grid;
  gap:8px;
}
.ledger-family-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:12px 13px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
}
.ledger-family-main{min-width:0}
.ledger-family-title{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
.ledger-family-title strong{font-size:14px}
.ledger-primary{
  padding:3px 7px;
  border-radius:999px;
  background:var(--brand-soft);
  color:var(--brand-dark);
  font-size:11px;
  font-weight:900;
}
.ledger-family-meta{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
}
.ledger-note{
  margin:9px 0 0;
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
}

.ledger-timeline{
  display:grid;
  gap:7px;
}
.ledger-timeline-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
}
.ledger-timeline-row strong{font-size:13px}
.ledger-timeline-row span{
  color:var(--muted);
  font-size:12px;
}

.ledger-actions{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-top:16px;
}
.ledger-actions .btn{
  flex:1 1 180px;
  min-height:46px;
}

@media(max-width:760px){
  .ledger-family-card,
  .ledger-timeline-row{
    align-items:flex-start;
    flex-direction:column;
  }
  .ledger-family-card .status-pill{align-self:flex-start}
}
'''
          if marker not in s:
              close = "</style>\n</head>"
              if close not in s:
                  raise SystemExit("ERROR: style close anchor not found")
              s = s.replace(close, css + "\n</style>\n</head>", 1)

          # 6. Static QA.
          required = [
              "利用者・家族台帳",
              "ledger-guide",
              "ご家族・LINE連携",
              "DPRO DAYCARE LEDGER USABILITY BRUSHUP R3",
              "LINE連携状況は、緊急・一斉連絡の送信対象判定にも使用します。",
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit("ERROR: required content missing: " + ", ".join(missing))

          if "利用者・家族検索" in s:
              raise SystemExit("ERROR: old visible ledger label remains")

          p.write_text(s, encoding="utf-8")
          print("OWNER_PATCH=PASS")
          PY

      - name: Validate owner source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'DPRO DAYCARE READABILITY BRUSHUP R2' owner.html
          grep -q 'DPRO DAYCARE LEDGER USABILITY BRUSHUP R3' owner.html
          grep -q '利用者・家族台帳' owner.html
          grep -q 'ご家族・LINE連携' owner.html
          ! grep -q '>利用者・家族検索<' owner.html
          echo "STATIC_QA=PASS"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- owner.html; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add owner.html
          git commit -m "DAYCARE ledger usability brushup R3"
          git push origin HEAD:main

      - name: Summary
        shell: bash
        run: |
          {
            echo "## DPRO DAYCARE Ledger Usability Brushup R3"
            echo ""
            echo "- Public demo banner clipping: fixed for desktop sidebar"
            echo "- 利用者・家族検索 -> 利用者・家族台帳"
            echo "- Ledger orientation / empty-state guidance: added"
            echo "- Family relationship / phone / primary-contact visibility: improved"
            echo "- LINE-link status presentation: future-compatible"
            echo "- Schedule and family-contact history: easier to scan"
            echo "- Existing APIs / broadcast logic: unchanged"
            echo "- Static QA: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
