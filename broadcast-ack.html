<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>連絡内容の確認｜DPRO デイサービス LINE</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#17352c;background:#f2f7f4}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px}
    main{width:min(560px,100%);padding:24px;border:1px solid #d8e5dd;border-radius:22px;background:#fff;box-shadow:0 18px 50px rgba(18,53,37,.12)}
    .mark{display:grid;place-items:center;width:54px;height:54px;border-radius:16px;background:#eaf6ee;font-size:28px}
    h1{margin:16px 0 8px;font-size:22px}p{margin:0 0 14px;line-height:1.7;color:#526158}
    button{width:100%;min-height:52px;border:0;border-radius:14px;background:#176b43;color:#fff;font-weight:900;font-size:16px;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}.status{margin-top:14px;padding:12px;border-radius:12px;background:#f5f8f6;white-space:pre-wrap}
    small{display:block;margin-top:16px;color:#718078;line-height:1.6}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✓</div>
    <h1>施設からの連絡内容を確認</h1>
    <p>内容をご確認いただきましたら、下のボタンを押してください。</p>
    <button id="ackButton" type="button">確認しました</button>
    <div class="status" id="status">まだ確認登録されていません。</div>
    <small>
      この操作は「施設からの連絡内容を確認した」ことを記録するものです。
      安否や健康状態を保証・判定するものではありません。
    </small>
  </main>
  <script src="./config.js"></script>
  <script>
    (function(){
      "use strict";
      const button=document.getElementById("ackButton");
      const status=document.getElementById("status");
      const config=window.DPRODaycare||window.DPRO_DAYCARE_CONFIG;
      const token=new URLSearchParams(location.search).get("token")||"";
      if(!token){
        button.disabled=true;
        status.textContent="確認用URLが正しくありません。施設へお問い合わせください。";
        return;
      }
      button.addEventListener("click",async()=>{
        button.disabled=true;
        button.textContent="登録中…";
        try{
          const data=await config.API.post("publicBroadcastAcknowledge",{token});
          status.textContent=data.message||"確認済みにしました。";
          button.textContent="確認済み";
        }catch(error){
          status.textContent=error?.message||"確認登録に失敗しました。";
          button.disabled=false;
          button.textContent="もう一度確認する";
        }
      });
    })();
  </script>
</body>
</html>
